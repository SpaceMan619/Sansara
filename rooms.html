<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Liminal Rooms — Sansara</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{ margin:0; background:#0b0a08; overflow:hidden; color:#e8e4d8;
        font:13px/1.5 system-ui,-apple-system,sans-serif; }
  /* Shown on arrival, then it leaves. Press ? to bring it back. */
  #hud{ position:fixed; left:50%; bottom:30px; transform:translateX(-50%); z-index:4;
        display:flex; gap:14px; align-items:center; white-space:nowrap;
        background:rgba(252,250,246,.62); backdrop-filter:blur(20px) saturate(140%);
        -webkit-backdrop-filter:blur(20px) saturate(140%);
        border:1px solid rgba(255,255,255,.7); color:rgba(44,39,34,.72);
        padding:9px 18px; border-radius:999px; font-size:12px; letter-spacing:.02em;
        box-shadow:0 8px 28px rgba(60,52,44,.16);
        opacity:0; visibility:hidden; transition:opacity .5s ease, visibility .5s; }
  #hud.show{ opacity:1; visibility:visible; }
  #hud b{ color:#241f1a; font-weight:600; }
  #hud .sep{ width:1px; height:13px; background:rgba(44,39,34,.16); }
  @media (max-width:700px){ #hud{ font-size:10.5px; padding:7px 12px; gap:9px; } }
  /* ---- Travel ------------------------------------------------------
     Rooms aren't a menu of files, they're places. Holding Tab pulls the
     world back behind glass and presents them as cards; releasing commits
     to one. The dock is gone: nothing sits on screen while you play. */
  #travel{ position:fixed; inset:0; z-index:5; display:grid; place-items:center;
           opacity:0; visibility:hidden; pointer-events:none; overflow:hidden;
           background:
             radial-gradient(circle at 14% 18%, rgba(255,255,255,.94), transparent 34%),
             radial-gradient(circle at 84% 74%, rgba(168,201,255,.62), transparent 38%),
             rgba(238,244,255,.76);
           backdrop-filter:blur(22px) saturate(155%);
           -webkit-backdrop-filter:blur(22px) saturate(155%);
           transition:opacity .42s cubic-bezier(.22,.61,.36,1), visibility .42s; }
  #travel::before, #travel::after{ content:''; position:absolute; border-radius:50%; pointer-events:none;
           filter:blur(44px); opacity:.72; }
  #travel::before{ width:48vw; height:48vw; left:-12vw; bottom:-24vw;
           background:rgba(255,255,255,.88); animation:travelDrift 11s ease-in-out infinite; }
  #travel::after{ width:42vw; height:42vw; right:-10vw; top:-19vw;
           background:rgba(127,168,255,.28); animation:travelDrift 14s ease-in-out infinite reverse; }
  #travel.on{ opacity:1; visibility:visible; pointer-events:auto; }
  #travel .travel-head{ position:absolute; top:max(34px,7vh); left:50%; transform:translateX(-50%);
           z-index:1; width:min(1120px,calc(100vw - 48px)); display:flex; align-items:flex-end;
           justify-content:space-between; color:#24304a; }
  #travel .kicker{ font:500 11px/1 system-ui,sans-serif; letter-spacing:.16em;
           text-transform:none; color:rgba(36,48,74,.66); }
  #travel .count{ font:400 13px/1 ui-serif,"Iowan Old Style",Georgia,serif;
           color:rgba(36,48,74,.58); }
  #travel .rail{ position:relative; z-index:1; display:flex; gap:13px; padding:26px 28px;
                 width:min(1180px,96vw); overflow-x:auto; scrollbar-width:none;
                 scroll-snap-type:x proximity; box-sizing:border-box; }
  @media (min-width:980px){ #travel .rail{ justify-content:center; } }
  #travel .rail::-webkit-scrollbar{ display:none; }
  .card{ position:relative; flex:1 0 168px; min-width:168px; max-width:188px; height:242px;
         scroll-snap-align:center; cursor:pointer; padding:0;
         border-radius:24px; overflow:hidden; text-align:left;
         background:rgba(255,255,255,.48); border:1px solid rgba(255,255,255,.84);
         box-shadow:0 18px 48px rgba(86,116,170,.13), inset 0 1px rgba(255,255,255,.72);
         transform:translateY(14px) scale(.965); opacity:0;
         transition:transform .42s cubic-bezier(.16,1,.3,1), opacity .32s ease,
                    box-shadow .34s cubic-bezier(.16,1,.3,1), border-color .3s ease;
         will-change:transform; backface-visibility:hidden; }
  #travel.on .card:not(.sel):not(:hover){ transform:none; opacity:1; }
  #travel.on .card.sel, #travel.on .card:hover{ opacity:1; }
  #travel .card:nth-child(1){ transition-delay:.02s } #travel .card:nth-child(2){ transition-delay:.05s }
  #travel .card:nth-child(3){ transition-delay:.08s } #travel .card:nth-child(4){ transition-delay:.11s }
  #travel .card:nth-child(5){ transition-delay:.14s } #travel .card:nth-child(6){ transition-delay:.17s }
  .card .swatch{ position:absolute; inset:0; opacity:.9; background-size:cover;
                 background-position:center;
                 background-image:radial-gradient(circle at 35% 24%, rgba(255,255,255,.9), transparent 32%),
                                  linear-gradient(155deg, var(--tint) 0%, #dbe8ff 100%);
                 transform:scale(1.03); transition:transform .7s cubic-bezier(.22,.61,.36,1), filter .4s; }
  .card .swatch.shot{ opacity:1; background-image:var(--shot); }
  .card .veil{ position:absolute; inset:0;
               background:linear-gradient(180deg, rgba(238,244,255,.02) 22%, rgba(238,244,255,.2) 48%, rgba(248,251,255,.96) 100%); }
  .card .idx{ position:absolute; top:13px; left:14px; z-index:1; display:grid; place-items:center;
              width:25px; height:25px; border-radius:50%; color:rgba(36,48,74,.62);
              background:rgba(255,255,255,.58); border:1px solid rgba(255,255,255,.78);
              backdrop-filter:blur(10px); font-size:9px; letter-spacing:.08em; }
  .card .txt{ position:absolute; left:16px; right:16px; bottom:16px; display:block; }
  .card .nm{ display:block; font:400 20px/1.15 ui-serif,"Iowan Old Style",Georgia,serif;
             color:#24304a; text-transform:lowercase; }
  .card .bl{ display:block; margin-top:6px; font-size:10.5px; line-height:1.4;
             color:rgba(36,48,74,.58); }
  .card.here .nm::after{ content:'  here'; font:600 8.5px/1 system-ui,sans-serif;
                         letter-spacing:.18em; text-transform:uppercase; color:#6f91d8; }
  .card:hover{ transform:translate3d(0,-5px,0); box-shadow:0 24px 58px rgba(86,116,170,.2); }
  .card:hover .swatch{ transform:scale(1.075); }
  /* Keyboard selection has to read at a glance and not be confusable with
     hover: the card lifts further, gains a ring, and its name goes dark. */
  .card.sel{ transform:translate3d(0,-10px,0) scale(1.025);
             box-shadow:0 28px 70px rgba(86,116,170,.24),
                        0 0 0 2px rgba(127,168,255,.78),
                        0 0 0 7px rgba(255,255,255,.62);
             border-color:rgba(255,255,255,.95); }
  .card.sel .nm{ color:#18233d; }
  .card.sel .bl{ color:rgba(36,48,74,.72); }
  .card:focus-visible{ outline:2px solid #7fa8ff; outline-offset:5px; }
  #travel .hint{ position:absolute; bottom:max(28px,6vh); left:0; right:0; text-align:center;
                 font-size:10.5px; letter-spacing:.24em; text-transform:uppercase;
                 color:rgba(36,48,74,.58); }
  @keyframes travelDrift{ 50%{ transform:translate3d(7%,-5%,0) scale(1.12); } }
  @media (max-width:640px){
    #travel .travel-head{ top:28px; }
    #travel .rail{ padding:24px; }
    .card{ flex-basis:154px; min-width:154px; height:214px; border-radius:21px; }
    .card .bl{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    #travel, .card{ transition-duration:.01ms !important; }
    .card .swatch{ transition:none !important; }
    #travel::before, #travel::after{ animation:none; }
  }

  #credit{ position:fixed; bottom:14px; left:16px; z-index:3; opacity:.55; font-size:11px;
           max-width:26vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #credit a{ color:#e8c98a; }
  #perf{ position:fixed; bottom:14px; right:16px; z-index:3;
          font-variant-numeric:tabular-nums; font-size:10px; letter-spacing:.035em;
          white-space:nowrap; text-align:right; color:rgba(36,48,74,.68);
          padding:6px 10px; border-radius:999px; background:rgba(250,252,255,.58);
          border:1px solid rgba(255,255,255,.72); backdrop-filter:blur(14px) saturate(140%);
          box-shadow:0 8px 24px rgba(62,83,125,.1); }
  /* ---- Opening ---------------------------------------------------
     A world in its own right, not a progress indicator on a blank page. */
  #load{ position:fixed; inset:0; z-index:8; display:grid; place-items:center;
         background:
           radial-gradient(circle at 72% 18%,rgba(255,255,255,.96) 0 8%,transparent 31%),
           radial-gradient(circle at 16% 12%,rgba(255,255,255,.76),transparent 32%),
           linear-gradient(155deg,#eef5ff 0%,#f7f7fa 45%,#fffaf2 100%);
         transition:opacity .9s cubic-bezier(.22,.61,.36,1), visibility .9s;
         color:#2e3955; overflow:hidden; isolation:isolate; }
  #load.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  #load canvas{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  #load .weather{ position:absolute; inset:0; z-index:-1; pointer-events:none; }
  #load .cloud{ position:absolute; display:block; border-radius:50%;
                filter:blur(34px); will-change:transform;
                background:radial-gradient(ellipse,rgba(255,255,255,.98) 0 28%,rgba(216,231,255,.66) 56%,rgba(216,231,255,0) 75%); }
  #load .cloud.c1{ width:56vw; height:26vw; left:-16vw; top:-2vw;
                   animation:openingCloud 15s ease-in-out infinite alternate; }
  #load .cloud.c2{ width:48vw; height:23vw; right:-10vw; top:11vh; opacity:.82;
                   animation:openingCloud 19s -6s ease-in-out infinite alternate-reverse; }
  #load .cloud.c3{ width:62vw; height:24vw; left:24vw; bottom:2vh; opacity:.64;
                   animation:openingCloud 22s -10s ease-in-out infinite alternate; }
  #load .glow{ position:absolute; width:28vw; aspect-ratio:1; right:4vw; top:-9vw;
               border-radius:50%; opacity:.48; filter:blur(12px);
               background:radial-gradient(circle,rgba(255,255,255,.98),rgba(224,205,255,.28) 47%,transparent 70%); }
  #load .hill{ position:absolute; left:-8%; right:-8%; bottom:-26vh; height:48vh;
               border-radius:50% 50% 0 0 / 42% 42% 0 0;
               background:linear-gradient(180deg,rgba(194,218,216,.54),rgba(154,188,187,.68));
               box-shadow:inset 0 1px rgba(255,255,255,.72); transform:rotate(-1.5deg); }
  #load .hill::after{ content:''; position:absolute; width:64%; height:88%; right:-9%; top:-18%;
                      border-radius:50%; background:linear-gradient(160deg,rgba(217,226,247,.76),rgba(166,194,213,.48));
                      box-shadow:inset 0 1px rgba(255,255,255,.68); }
  #load .box{ position:relative; z-index:1; display:grid; justify-items:center;
              width:min(90vw,680px); text-align:center; transform:translateY(-3vh);
              animation:openingArrive 1.15s cubic-bezier(.16,1,.3,1) both; }
  #load .brand{ display:grid; justify-items:center; }
  #load .brand strong{ font:400 clamp(72px,10vw,126px)/.82 "Snell Roundhand","Apple Chancery","Segoe Script",cursive;
                       letter-spacing:-.055em; color:#334467; text-shadow:0 12px 42px rgba(82,111,163,.16); }
  #load .brand small{ margin-top:20px; font:500 9px/1 system-ui,-apple-system,sans-serif;
                      letter-spacing:.34em; text-transform:uppercase; color:rgba(52,72,108,.48); }
  #load .destination{ margin-top:46px; min-width:min(72vw,284px); padding:13px 22px 14px;
                      border:1px solid rgba(255,255,255,.88); border-radius:20px;
                      background:rgba(255,255,255,.42); backdrop-filter:blur(22px) saturate(145%);
                      -webkit-backdrop-filter:blur(22px) saturate(145%);
                      box-shadow:0 20px 60px rgba(85,112,161,.13),inset 0 1px rgba(255,255,255,.72); }
  #load .destination span{ display:block; margin-bottom:5px; font-size:8px; font-weight:650;
                           letter-spacing:.29em; text-transform:uppercase; color:rgba(52,72,108,.42); }
  #load .name{ font:400 22px/1.25 ui-serif,"Iowan Old Style",Georgia,serif;
               letter-spacing:.01em; color:#2e3c5b; }
  #load .progress{ display:grid; grid-template-columns:auto auto; align-items:center;
                   column-gap:14px; row-gap:10px; margin-top:22px; }
  #load .lbl{ font-size:9px; letter-spacing:.18em; text-transform:lowercase;
              color:rgba(52,72,108,.52); justify-self:start; }
  #load .pct{ display:block; font-size:9px; font-variant-numeric:tabular-nums;
              color:rgba(52,72,108,.44); justify-self:end; }
  #load .bar{ grid-column:1/-1; width:min(66vw,274px); height:3px; border-radius:99px;
              background:rgba(91,117,164,.12); overflow:hidden; box-shadow:inset 0 1px 2px rgba(61,85,128,.08); }
  #load .bar i{ display:block; height:100%; width:0%; border-radius:inherit;
                background:linear-gradient(90deg,#91b9f3,#ad9eea 58%,#e4bcd9);
                box-shadow:0 0 13px rgba(129,154,224,.68);
                transition:width .35s cubic-bezier(.22,.61,.36,1); }
  @keyframes openingCloud{ to{ transform:translate3d(8%,-5%,0) scale(1.08); } }
  @keyframes openingArrive{ from{ opacity:0; transform:translateY(2vh) scale(.975); filter:blur(7px); }
                            to{ opacity:1; transform:translateY(-3vh) scale(1); filter:blur(0); } }
  @media (max-width:640px){
    #load .brand strong{ font-size:72px; }
    #load .destination{ margin-top:38px; }
    #load .hill{ bottom:-31vh; }
  }
  @media (prefers-reduced-motion:reduce){
    #load .cloud,#load .box{ animation:none !important; }
  }

  #wipe{ position:fixed; inset:0; z-index:9; pointer-events:none; opacity:0; visibility:hidden;
         overflow:hidden; background:
           radial-gradient(circle at 15% 18%,rgba(255,255,255,.96),transparent 34%),
           radial-gradient(circle at 83% 77%,rgba(173,202,255,.56),transparent 40%),
           linear-gradient(145deg,#eef5ff,#fffaf3);
         transition:opacity .65s cubic-bezier(.22,.61,.36,1), visibility .65s; }
  #wipe.on{ opacity:1; visibility:visible; }
  #wipe.reveal{ opacity:0; visibility:hidden; }
  #wipe .cloud{ position:absolute; border-radius:50%; filter:blur(38px); opacity:0;
           background:radial-gradient(circle, rgba(255,255,255,.98), rgba(168,201,255,.36) 46%, rgba(219,232,255,0) 72%); }
  #wipe.on .cloud{ animation:cloudPass 1.35s cubic-bezier(.22,.61,.36,1) both; }
  #wipe .cloud.c1{ left:-10%; top:-18%; width:66vw; height:66vw; }
  #wipe .cloud.c2{ right:-13%; bottom:-25%; width:72vw; height:72vw; animation-delay:.08s; }
  #wipe .aperture{ position:absolute; left:50%; top:50%; width:178px; height:242px;
           transform:translate(-50%,-50%) scale(.82); opacity:0; overflow:hidden;
           border-radius:24px; border:1px solid rgba(255,255,255,.9);
           background-image:var(--wipe-image); background-color:var(--wipe-tint,#dbe8ff);
           background-size:cover; background-position:center;
           box-shadow:0 28px 90px rgba(86,116,170,.23); }
  #wipe.on .aperture{ animation:apertureOpen .82s cubic-bezier(.22,.61,.36,1) both; }
  #wipe .transition-copy{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
           display:grid; justify-items:center; gap:8px; color:#24304a; opacity:0; width:min(84vw,420px); }
  #wipe.on .transition-copy{ animation:transitionCopy 1.05s .18s ease both; }
  #wipe .transition-copy .mark{ margin-bottom:18px; font:400 32px/1 "Snell Roundhand","Apple Chancery","Segoe Script",cursive;
           color:rgba(51,68,103,.72); letter-spacing:-.035em; }
  #wipe .transition-copy span:not(.mark){ font-size:9px; letter-spacing:.3em; text-transform:uppercase;
           color:rgba(36,48,74,.46); }
  #wipe .transition-copy b{ font:400 clamp(30px,5vw,52px)/1.05 ui-serif,"Iowan Old Style",Georgia,serif; }
  #wipe .transition-progress{ display:grid; grid-template-columns:auto auto; align-items:center;
           width:250px; row-gap:9px; margin-top:28px; opacity:0; transition:opacity .35s ease; }
  #wipe.loading .transition-progress{ opacity:1; }
  #wipe .transition-progress em,#wipe .transition-progress small{ font:500 8.5px/1 system-ui,sans-serif;
           color:rgba(36,48,74,.46); letter-spacing:.15em; text-transform:lowercase; font-style:normal; }
  #wipe .transition-progress small{ justify-self:end; letter-spacing:.04em; }
  #wipe .transition-bar{ grid-column:1/-1; height:3px; overflow:hidden; border-radius:99px;
           background:rgba(91,117,164,.13); }
  #wipe .transition-bar i{ display:block; width:0; height:100%; border-radius:inherit;
           background:linear-gradient(90deg,#91b9f3,#ad9eea 58%,#e4bcd9);
           box-shadow:0 0 13px rgba(129,154,224,.68); transition:width .35s cubic-bezier(.22,.61,.36,1); }
  @keyframes apertureOpen{
    0%{ opacity:0; transform:translate(-50%,-46%) scale(.82); filter:blur(5px); }
    38%{ opacity:.88; transform:translate(-50%,-50%) scale(1); filter:blur(0); }
    100%{ opacity:.12; transform:translate(-50%,-50%) scale(7.2); filter:blur(8px); border-radius:8px; }
  }
  @keyframes cloudPass{ 0%{ opacity:0; transform:scale(.55); } 55%{ opacity:.9; } 100%{ opacity:.42; transform:scale(1.35) translate3d(5%,-4%,0); } }
  @keyframes transitionCopy{ 0%,22%{ opacity:0; transform:translate(-50%,-42%); } 55%,82%{ opacity:1; transform:translate(-50%,-50%); } 100%{ opacity:.72; transform:translate(-50%,-50%); } }
  @media (prefers-reduced-motion: reduce){
    #wipe{ transition-duration:.18s !important; }
    #wipe .cloud, #wipe .aperture, #wipe .transition-copy{ animation:none !important; }
    #wipe.on .transition-copy{ opacity:1; }
  }
  #vig{ position:fixed; inset:0; pointer-events:none; z-index:1;
        background:radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 48%,
                   rgba(0,0,0,0.18) 82%, rgba(0,0,0,0.42) 100%); }
  /* Dev tools use the same pale glass as travel. The tools may be technical;
     they do not need to feel like a different, dark application. */
  #tune{ position:fixed; top:12px; right:12px; z-index:6; width:236px;
         color:#293755; background:rgba(248,251,255,.74); backdrop-filter:blur(22px) saturate(145%);
         border:1px solid rgba(255,255,255,.82); box-shadow:0 22px 68px rgba(65,87,132,.18);
         border-radius:18px; font-size:12px; overflow:hidden;
         opacity:0; visibility:hidden; transform:translateY(-8px) scale(.985);
         transition:opacity .3s, transform .3s, visibility .3s linear; }
  #tune.shown{ opacity:1; visibility:visible; transform:none; }
  #tune .ph{ display:flex; justify-content:space-between; align-items:center;
             padding:10px 12px; border-bottom:1px solid rgba(83,108,157,.14); }
  #tune .pb{ padding:8px 10px 10px; max-height:72vh; overflow-y:auto; }
  #tune .psection{ margin:12px 0 8px; color:rgba(41,55,85,.48); font-size:9px;
                   font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
  #tune label{ display:grid; grid-template-columns:1fr 38px; gap:2px 6px; margin-bottom:7px;
               align-items:center; }
  #tune label span{ opacity:.75; }
  #tune output{ text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  #tune input[type=range]{ grid-column:1/-1; width:100%; height:14px; margin:0; accent-color:#7b9fe0; }
  #tune .look-colors{ display:grid; grid-template-columns:1fr auto; gap:7px 10px; align-items:center;
                      margin-bottom:10px; }
  #tune .look-colors label{ display:contents; }
  #tune input[type=color]{ width:34px; height:24px; padding:2px; border-radius:8px; cursor:pointer;
                          background:rgba(255,255,255,.65); border:1px solid rgba(83,108,157,.2); }
  #tune button{ font:inherit; color:#344566; background:rgba(255,255,255,.6);
                border:1px solid rgba(83,108,157,.2); border-radius:999px; padding:4px 9px; cursor:pointer; }
  #tune button:hover{ background:rgba(255,255,255,.92); }
  #tune .pact{ display:flex; gap:6px; margin-top:11px; padding-top:10px; border-top:1px solid rgba(83,108,157,.14); }
  #tune .devcam{ display:grid; grid-template-columns:1fr auto; gap:3px 8px; align-items:center;
                 margin:3px 0 10px; padding:9px; border:1px solid rgba(83,108,157,.15); border-radius:12px;
                 background:rgba(255,255,255,.42); }
  #tune .devcam small{ grid-column:1/-1; color:rgba(41,55,85,.58); line-height:1.35; }
  #tune #xrayToggle[aria-pressed="true"]{ background:#789ee1; border-color:#789ee1; color:#fff; }
  #tune #tuneCopy{ flex:1; background:#789ee1; border-color:#789ee1; color:#fff; font-weight:600; }
  #tune .pcopy{ display:none; width:100%; margin-top:8px; font:11px ui-monospace,monospace;
                background:rgba(255,255,255,.72); color:#293755; border:1px solid rgba(83,108,157,.2); border-radius:9px; padding:6px; }
  @media (max-width:760px){ #tune{ display:none; } }
</style>
</head>
<body>
<div id="hud"></div>
<div id="tune"></div>
<div id="vig"></div>
<div id="credit"></div>
<div id="perf" title="Measured wall-clock frame rate, average frame time, one-percent-low FPS, and draw calls">measuring frame pace…</div>
<div id="travel" role="dialog" aria-modal="true" aria-label="Choose another place" aria-hidden="true">
  <div class="travel-head"><span class="kicker">press tab to choose your world</span><span class="count" id="travelCount" aria-live="polite"></span></div>
  <div class="rail" id="rail" aria-label="Places"></div>
  <div class="hint">hold tab · ← → to choose · release to travel</div>
</div>
<div id="wipe">
  <i class="cloud c1"></i><i class="cloud c2"></i>
  <div class="aperture"></div>
  <div class="transition-copy">
    <span class="mark">Sansara</span><span>entering</span><b id="wipeName">another place</b>
    <div class="transition-progress">
      <em id="wipePhase">opening</em><small id="wipePct">0%</small>
      <div class="transition-bar"><i id="wipeBar"></i></div>
    </div>
  </div>
</div>
<div id="load">
  <div class="weather" aria-hidden="true">
    <i class="glow"></i><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="hill"></i>
  </div>
  <canvas id="loadArt" width="264" height="264" aria-hidden="true"></canvas>

/* ==================== collision from geometry ===================
   These scenes ship no collision data, so it gets derived from the

function buildCollision(root, box){
  const PAD = 0.5;

  const spanX = (box.max.x - box.min.x) + PAD*2, spanZ = (box.max.z - box.min.z) + PAD*2;

  const MAXDIM = 640;

  const ceilHist = new Map();             // downward-facing faces -> ceiling height

  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), n = new THREE.Vector3();

      b.fromBufferAttribute(pos,i1).applyMatrix4(o.matrixWorld);

      const x0 = Math.min(a.x,b.x,c.x), x1 = Math.max(a.x,b.x,c.x);
      const z0 = Math.min(a.z,b.z,c.z), z1 = Math.max(a.z,b.z,c.z);
      const y0 = Math.min(a.y,b.y,c.y), y1 = Math.max(a.y,b.y,c.y);
      const cx0 = Math.max(0, Math.floor((x0-minX)/cell)), cx1 = Math.min(nx-1, Math.floor((x1-minX)/cell));
      const cz0 = Math.max(0, Math.floor((z0-minZ)/cell)), cz1 = Math.min(nz-1, Math.floor((z1-minZ)/cell));

           bottom of a pool instead of on the deck around it.

           quads (81m across = 200 cells). Skipping large faces threw the
           floor away and left only the small ceiling tiles to vote, which
           put the player on the ceiling. */

        }
        /* Store the plane, not a single height. Using the triangle's minimum Y
           across its whole footprint sinks the player into sloped ground —
           a hillside triangle can span metres of drop. Evaluating the plane at
           each cell centre follows the surface instead. */
        flats.push(cx0,cx1,cz0,cz1, up?1:0, n.x, n.y, n.z, n.x*a.x + n.y*a.y + n.z*a.z, y0, y1);
        const q = Math.round(y0*4)/4;                     // 25cm buckets
        const area = (cx1-cx0+1)*(cz1-cz0+1);
        // Upward faces are what you can stand on, so they outvote ceilings.
        hist.set(q, (hist.get(q)||0) + area*(up?4:1));

      }

     camera is free to rise. */
  let ceiling = null, cBest = -1;

  }

  for (let t=0;t<flats.length;t+=11){
    const cx0=flats[t], cx1=flats[t+1], cz0=flats[t+2], cz1=flats[t+3], up=flats[t+4];
    const nX=flats[t+5], nY=flats[t+6], nZ=flats[t+7], d=flats[t+8];
    const yLo=flats[t+9], yHi=flats[t+10];
    if (sawUpFace && !up) continue;               // stand on floors, not ceilings
    if (Math.abs(nY) < 1e-4) continue;
    for (let cz=cz0;cz<=cz1;cz++) for (let cx=cx0;cx<=cx1;cx++){
      const wx = minX + (cx+0.5)*cell, wz = minZ + (cz+0.5)*cell;
      let y = (d - nX*wx - nZ*wz) / nY;           // plane height at this cell
      if (y < yLo) y = yLo; else if (y > yHi) y = yHi;
      const k = cz*nx+cx;
      const dist = Math.abs(y - mode);
      if (dist < bestDist[k]){ bestDist[k] = dist; floorY[k] = y; }
    }

  for (let t=0;t<tris.length;t+=6){
    const cx0=tris[t], cx1=tris[t+1], cz0=tris[t+2], cz1=tris[t+3], y0=tris[t+4], y1=tris[t+5];
    for (let cz=cz0;cz<=cz1;cz++) for (let cx=cx0;cx<=cx1;cx++){
      const k = cz*nx+cx;
      const f = floorY[k];
      if (!isFinite(f)) continue;
      if (y1 > f+0.28 && y0 < f+1.55) blocked[k] = 1;
    }
  }
  return { nx, nz, cell, minX, minZ, floorY, blocked, mode, ceiling,
    idx(x,z){
      const cx = Math.floor((x-this.minX)/this.cell), cz = Math.floor((z-this.minZ)/this.cell);
      if (cx<0||cz<0||cx>=this.nx||cz>=this.nz) return -1;
      return cz*this.nx+cx;
    },
    walkable(x,z, fromY){
      const k = this.idx(x,z);
      if (k<0 || this.blocked[k]) return false;
      const f = this.floorY[k];
      if (!isFinite(f)) return false;
      return fromY === undefined ? true : Math.abs(f - fromY) < 0.65;   // no climbing walls
    },
    /* Bilinear across the four surrounding cells. A single cell lookup is a
       flat step, so on a slope the feet sink by up to cell-size × gradient —
       visible as legs disappearing into a hillside. Interpolating follows the
       surface instead. Falls back to the nearest valid sample near edges and
       walls, where some neighbours have no floor at all. */
    groundAt(x,z, fallback){
      const fx = (x-this.minX)/this.cell - 0.5, fz = (z-this.minZ)/this.cell - 0.5;
      const i0 = Math.floor(fx), j0 = Math.floor(fz);
      const tx = fx-i0, tz = fz-j0;
      let acc = 0, wsum = 0, near = null, nearW = -1;
      for (let dj=0; dj<2; dj++) for (let di=0; di<2; di++){
        const i = i0+di, j = j0+dj;
        if (i<0||j<0||i>=this.nx||j>=this.nz) continue;
        const v = this.floorY[j*this.nx+i];
        if (!isFinite(v)) continue;
        const w = (di?tx:1-tx) * (dj?tz:1-tz);
        acc += v*w; wsum += w;
        if (w > nearW){ nearW = w; near = v; }
      }
      if (wsum > 0.001) return acc/wsum;
      return near !== null ? near : fallback;
    },
    /* Spiral out from the requested spawn until a walkable cell turns up,
       so a hint that lands inside geometry still produces a valid start. */
    /* Spiral out from the hint until a walkable cell on the dominant floor
       turns up, so a hint that lands in geometry or in a pit still yields a
       sensible start. */
    findSpawn(hx, hz){
      const onMainFloor = (x,z)=>{
        const k = this.idx(x,z);
        return k>=0 && !this.blocked[k] && isFinite(this.floorY[k])
               && Math.abs(this.floorY[k] - this.mode) < 0.3;
      };
      if (onMainFloor(hx,hz)) return [hx,hz];
      for (let r=1;r<Math.max(this.nx,this.nz);r++){
        for (let i=-r;i<=r;i++) for (const [dx,dz] of [[i,-r],[i,r],[-r,i],[r,i]]){
          const x = hx + dx*this.cell, z = hz + dz*this.cell;
          if (onMainFloor(x,z)) return [x,z];
        }
      }
      for (let r=1;r<Math.max(this.nx,this.nz);r++){
        for (let i=-r;i<=r;i++) for (const [dx,dz] of [[i,-r],[i,r],[-r,i],[r,i]]){
          const x = hx + dx*this.cell, z = hz + dz*this.cell;
          if (this.walkable(x,z)) return [x,z];
        }
      }
      return [hx,hz];
    }
  };
}

/* Handing over between clips.

   Two things bite here. `fadeOut()` never stops an action, it only drives
   the weight down — so an interrupted fade leaves a clip contributing
   forever. And a LoopOnce clip with clampWhenFinished holds its last frame
   at full weight after it ends, so it blends into everything that follows
   unless something explicitly retires it.

   Every outgoing action is therefore given a deadline, and the sweep below
   stops it once the fade has had time to finish. */
const fadingOut = new Map();      // action -> time it must be stopped

function play(name, fade=0.18){
  if (!mixer || !actions[name] || currentAction===name) return;
  const next = actions[name];
  const prev = currentAction ? actions[currentAction] : null;

  next.enabled = true;
  next.setEffectiveWeight(1);
  next.reset().play();
  fadingOut.delete(next);

  if (prev && prev !== next){
    prev.enabled = true;
    next.crossFadeFrom(prev, fade, false);
    fadingOut.set(prev, performance.now() + fade*1000 + 120);
  }
  // Anything still lit that isn't part of this handover gets a deadline too.
  for (const key in actions){
    const a = actions[key];
    if (a === next || a === prev) continue;
    if (a.isRunning() || a.getEffectiveWeight() > 0.001){
      if (!fadingOut.has(a)) fadingOut.set(a, performance.now() + fade*1000 + 120);
    }
  }
  currentAction = name;
}

function retireFadedActions(){
  if (!mixer) return;
  const now = performance.now();
  for (const key in actions){
    const a = actions[key];
    if (key === currentAction){ fadingOut.delete(a); continue; }
    const decayed = a.getEffectiveWeight() < 0.005;
    const expired = fadingOut.has(a) && now >= fadingOut.get(a);
    if ((decayed || expired) && (a.isRunning() || a.enabled)){
      a.stop();
      a.enabled = false;
      a.setEffectiveWeight(0);
      fadingOut.delete(a);
    }
  }
}
/* A baked scene can't receive a real shadow, so the character would look
   pasted on. A soft blob under the feet grounds him in every room and
   costs one transparent quad. */
function makeBlobShadow(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,2, 64,64,62);
  g.addColorStop(0,'rgba(0,0,0,0.55)'); g.addColorStop(0.55,'rgba(0,0,0,0.22)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
  const tex = new THREE.CanvasTexture(c);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.25,1.25),
    new THREE.MeshBasicMaterial({ map:tex, transparent:true, depthWrite:false, fog:false }));
  m.rotation.x = -Math.PI/2;
  return m;
}


/* Per-clip ground offset.

   Correcting the model's height every frame so the lowest foot sits exactly
   on the floor also cancels the gait's natural rise during push-off, which
   makes the legs compress and stretch to compensate — it reads as a limp.
   Instead each clip is sampled once through its cycle, and the single lowest
   moment becomes a constant offset. Feet plant, and the bob survives. */
function computeClipGroundOffsets(model, baseY){
  const offs = {};
  const names = Object.keys(actions);
  const saved = currentAction;
  const v = new THREE.Vector3();
  const SAMPLES = 14, VSTEP = 4;      // every 4th vertex is plenty for a minimum
  for (const name of names){
    const act = actions[name];
    for (const a of Object.values(actions)){ a.stop(); a.setEffectiveWeight(0); }
    act.reset().play(); act.setEffectiveWeight(1); act.paused = true;
    const dur = act.getClip().duration || 0.001;
    let minY = Infinity;
    for (let i=0;i<SAMPLES;i++){
      act.time = (i/SAMPLES)*dur;
      mixer.update(0);
      avatar.updateMatrixWorld(true);
      model.traverse(o=>{
        if (!o.isSkinnedMesh || !o.skeleton) return;
        const attr = o.geometry.attributes.position;
        for (let k=0;k<attr.count;k+=VSTEP){
          v.fromBufferAttribute(attr,k);
          o.applyBoneTransform(k,v);
          o.localToWorld(v);
          if (v.y < minY) minY = v.y;
        }
      });
    }
    act.paused = false; act.stop(); act.setEffectiveWeight(0);
    offs[name] = isFinite(minY) ? baseY - minY : baseY;
  }
  for (const a of Object.values(actions)){ a.stop(); a.enabled = false; a.setEffectiveWeight(0); }
  currentAction = null;
  if (saved && actions[saved]) play(saved, 0);

  /* Clamp to a band around the median. A clip whose rig sits at a very
     different height — Mixamo's hard landing starts in a deep crouch, its
     hips a body-width below every other clip — would otherwise drive the
     model straight through the floor. Locomotion clips agree closely, so
     the median is a reliable anchor. */
  const vals = Object.values(offs).sort((a,b)=>a-b);
  const median = vals.length ? vals[vals.length>>1] : baseY;
  for (const k of Object.keys(offs))
    offs[k] = THREE.MathUtils.clamp(offs[k], median-0.12, median+0.12);
  return offs;
}

async function loadAvatar(){
  const gltf = await loadGLB('output/minimal-scifi-sikh-animated.glb?v=4');
  gltf.scene.traverse(o=>{ if(o.isMesh) o.frustumCulled = false; });
  avatar = new THREE.Group(); avatar.add(gltf.scene);
  mixer = new THREE.AnimationMixer(avatar);
  for (const c of gltf.animations) actions[c.name] = mixer.clipAction(c);
  for (const once of ['Jump','Land','Jump_Start','Jump_Land'])
    if (actions[once]){ actions[once].setLoop(THREE.LoopOnce); actions[once].clampWhenFinished = true; }
  if (actions.Jump_Loop) actions.Jump_Loop.setLoop(THREE.LoopRepeat);
  if (hasStagedJump()){
    TUNE.jumpWindup = DEFAULTS.jumpWindup = UAL_TAKEOFF;
    TUNE.landHold = DEFAULTS.landHold = UAL_LAND_RECOVERY;
  }
  play(actions.Idle ? 'Idle' : 'Walk');
  if (currentAction) actions[currentAction].setEffectiveWeight(1);
  mixer.update(0);
  gltf.scene.traverse(o=>{ if(o.isBone && /Toe|Foot/i.test(o.name)) footBones.push(o); });

  avatar.updateMatrixWorld(true);
  const box = posedExtents(gltf.scene);
  const size = box.getSize(new THREE.Vector3());
  const s = 1.75/size.y;
  baseCharScale = s;
  gltf.scene.scale.setScalar(s);
  gltf.scene.position.set(-(box.min.x+size.x/2)*s, -box.min.y*s, -(box.min.z+size.z/2)*s);
  avatar.updateMatrixWorld(true);
  baseModelY = gltf.scene.position.y;
  clipGroundOffset = computeClipGroundOffsets(gltf.scene, baseModelY);
  groundOffsetY = clipGroundOffset[currentAction] ?? baseModelY;
  gltf.scene.position.y = groundOffsetY;

  // Hips travel is in rig units (~100x mesh units), so the conversion
  // needs the Hips' world scale, not the mesh scale.
  let hipsScale = s * 0.01;
  const hips = avatar.getObjectByName('mixamorig:Hips');
  if (hips && hips.parent){ hips.parent.getWorldScale(_v); if (_v.x>0) hipsScale = _v.x; }
  for (const nm of Object.keys(CLIP_TRAVEL)){
    if (!actions[nm]) continue;
    const dur = actions[nm].getClip().duration;
    if (dur>0) nominal[nm] = CLIP_TRAVEL[nm]*hipsScale/dur;
  }
  if (nominal.Walk) TUNE.walkSpeed = DEFAULTS.walkSpeed = +nominal.Walk.toFixed(2);
  if (nominal.Run)  TUNE.runSpeed  = DEFAULTS.runSpeed  = +nominal.Run.toFixed(2);
  blob = makeBlobShadow();
}

/* ====================== image-based lighting ====================
   The thing that makes an offline render read as "ray traced" is that
   surfaces receive light from every direction, not from a handful of
   point lights. Prefiltering a small environment scene into a mip chain
   (PMREM) buys exactly that: soft omnidirectional light plus
   roughness-aware reflections, evaluated per pixel from one cubemap.

   It's the same move the film industry made when image-based lighting
   replaced rigs of 50+ lights, and it's cheap — the cubemap is built once
   at load, so runtime cost is a texture sample rather than N light
   evaluations. Built from geometry here instead of a downloaded HDRI so
   the page stays self-contained and the warmth is tunable per room. */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
let envRT = null;

function buildEnvironment(cfg){
  const c = cfg || { wall:0x9a9a9a, panel:0xffffff, floor:0x555555, intensity:1 };
  const env = new THREE.Scene();
  const box = new THREE.BoxGeometry(1,1,1);
  box.deleteAttribute('uv');

  const shell = new THREE.Mesh(box, new THREE.MeshStandardMaterial({
    color:c.wall, roughness:1, metalness:0, side:THREE.BackSide }));
  shell.scale.set(22, 13, 22);
  env.add(shell);

  const ground = new THREE.Mesh(box, new THREE.MeshStandardMaterial({
    color:c.floor, roughness:1, metalness:0 }));
  ground.scale.set(22, 0.4, 22); ground.position.y = -6.4;
  env.add(ground);

  // Emissive panels overhead are what produce the soft top-down falloff.
  const panelMat = new THREE.MeshBasicMaterial({ color:c.panel });
  const panel = (x,z,sx,sz)=>{
    const m = new THREE.Mesh(box, panelMat);
    m.position.set(x, 6.0, z); m.scale.set(sx, 0.2, sz);
    env.add(m);
  };
  panel(-5.5, -5.5, 7, 7); panel(5.5, -5.5, 7, 7);
  panel(-5.5,  5.5, 7, 7); panel(5.5,  5.5, 7, 7);
  panel(0, 0, 4, 14);

  env.add(new THREE.HemisphereLight(c.panel, c.floor, 1.0));
  return env;
}

function applyEnvironment(cfg){
  if (envRT){ envRT.dispose(); envRT = null; }
  const envScene = buildEnvironment(cfg);
  envRT = pmrem.fromScene(envScene, 0.04);
  scene.environment = envRT.texture;
  scene.environmentIntensity = (cfg && cfg.intensity) || 1.0;
  envScene.traverse(o=>{ if (o.isMesh){ o.geometry.dispose(); o.material.dispose(); } });
}

/* ======================== room switching ======================= */
function disposeRoom(){
  if (!roomRoot) return;
  roomRoot.traverse(o=>{
    if (o.isMesh){
      o.geometry?.dispose();
      const ms = Array.isArray(o.material)?o.material:[o.material];
      for (const m of ms){
        for (const k of ['map','normalMap','roughnessMap','metalnessMap','emissiveMap','aoMap'])
          m[k]?.dispose();
        m.dispose();
      }
    }
  });
  scene.remove(roomRoot);
  roomRoot = null;
}

async function loadRoom(key){
  const cfg = ROOMS[key];
  showLoader(cfg.label);
  setProgress(0.02, 'opening');

  if (scene) disposeRoom(); else scene = new THREE.Scene();
  // drop everything but the avatar so lighting doesn't accumulate per room
  for (const child of [...scene.children]) if (child !== avatar && child !== blob) scene.remove(child);

  /* A room is either a file to load or a module that builds itself. Both
     hand back the same shape, so everything downstream is identical. */
  let built = null, gltf = null;
  if (cfg.module){
    try {
      setProgress(0.12, 'building the room');
      const mod = await import('./' + cfg.module);
      built = await mod.build({ THREE, loadGLB, renderer });
      Object.assign(cfg, {
        baked: built.baked, fog: built.fog, exposure: built.exposure,
        charScale: built.charScale, camDist: built.camDist,
        env: built.env, lights: built.lights, spawn: built.spawn,
      });
    } catch(e){
      setProgress(1, 'unavailable');
      document.getElementById('loadName').textContent = cfg.label + " wouldn't build";
      document.getElementById('loadPhase').textContent = e.message;
      console.error(e); buildHud(); return;
    }
  }
  try {
    if (!built) gltf = await new Promise((res,rej)=>loader.load(cfg.file, res, ev=>{
      if (ev.lengthComputable) setProgress(0.05 + 0.75*(ev.loaded/ev.total), 'loading the room');
      else setProgress(Math.min(0.7, 0.05 + ev.loaded/6e6), 'loading the room');
    }, rej));
  } catch(e){
    setProgress(1, 'unavailable');
    document.getElementById('loadName').textContent = `${cfg.label} isn't published here yet`;
    document.getElementById('loadPhase').textContent = 'not published here yet';
    buildHud();
    return;                     // keep the previous room's grid usable
  }
  setProgress(0.84, 'setting the light');
  roomRoot = built ? built.root : gltf.scene;
  devLights = { ambient:null, hemi:null, key:null, fill:null };

  /* Baked scenes: force unlit. Reproduces the artist's lighting exactly
     and skips lighting math entirely. */
  if (cfg.baked){
    /* A baked room has no lights, so a PBR character renders pure black.
       These lights are safe to add globally: the room is converted to
       MeshBasicMaterial below, which is unlit by definition and ignores
       them, so the only thing they can touch is the character. Tinted per
       room so he sits in the room's own colour instead of looking pasted in. */
    const cl = cfg.charLight || { sky:0xffffff, ground:0x888888, dir:0xffffff, amb:0.5, hemi:0.7, dirI:0.8 };
    const amb = new THREE.AmbientLight(cl.sky, cl.amb);
    const hemi = new THREE.HemisphereLight(cl.sky, cl.ground, cl.hemi);
    const dir = new THREE.DirectionalLight(cl.dir, cl.dirI);
    dir.position.set(4, 9, 3);
    for (const l of [amb, hemi, dir]) scene.add(l);
    devLights = { ambient:amb, hemi, key:dir, fill:null };

    roomRoot.traverse(o=>{
      if (!o.isMesh) return;
      const ms = Array.isArray(o.material)?o.material:[o.material];
      const next = ms.map(m=>{
        if (cfg.liveMaterials?.some(name=>m.name === name || m.name.startsWith(name+'.'))){
          if (m.name.startsWith('Material.008')){
            m.emissive?.set(0x8ff7ef);
            m.emissiveIntensity = 1.35;
            m.toneMapped = false;
          } else if (m.name.startsWith('Material.005')){
            // The water stays live so the soft studio environment can move
            // across it. Keep it deep blue and glossy; the baked room itself
            // supplies the pale, cloudy contrast around the pool.
            m.color?.set(0x17283c);
            m.metalness = 0.08;
            m.roughness = 0.16;
            m.envMapIntensity = 1.65;
          }
          return m;
        }
        if (m.type === 'MeshBasicMaterial') return m;
        const b = new THREE.MeshBasicMaterial({
          map: m.map || null, color: m.color ? m.color.clone() : new THREE.Color(0xffffff),
          side: m.side, transparent: m.transparent, opacity: m.opacity,
          alphaTest: m.alphaTest, toneMapped: true, fog: true,
        });
        if (!m.map && m.emissiveMap) b.map = m.emissiveMap;
        return b;
      });
      o.material = Array.isArray(o.material) ? next : next[0];
    });
  } else {
    /* With IBL carrying the ambient, the remaining lights only need to
       supply direction and highlights — a big flat ambient would just
       wash the environment contribution out again. */
    const L = cfg.lights || { ambient:0.3, hemi:0.5, dir:1.2, sky:0xdfe8f5, ground:0x8a8460 };
    const amb = new THREE.AmbientLight(0xffffff, L.ambient);
    const hemi = new THREE.HemisphereLight(L.sky, L.ground, L.hemi);
    scene.add(amb);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xfff4e2, L.dir);
    key.position.set(28, 55, 18);
    scene.add(key);
    const fill = new THREE.DirectionalLight(L.sky, L.dir*0.28);
    fill.position.set(-30, 24, -22);
    scene.add(fill);
    devLights = { ambient:amb, hemi, key, fill };
  }
  roomUpdate = built && built.update ? built.update : null;
  roomSun = null;
  if (!(built && built.sun && built.sun.shadow)) renderer.shadowMap.enabled = false;
  if (built && built.sun){
    const sl = new THREE.DirectionalLight(0xffe2b0, 2.5);
    sl.castShadow = !!built.sun.shadow;
    renderer.shadowMap.enabled = sl.castShadow;
    if (sl.castShadow){
      sl.shadow.mapSize.set(1024,1024);
      sl.shadow.camera.near = 1; sl.shadow.camera.far = 180;
      Object.assign(sl.shadow.camera, { left:-30, right:30, top:30, bottom:-30 });
      sl.shadow.bias = -0.0006; sl.shadow.normalBias = 0.05;
    }
    scene.add(sl); scene.add(sl.target);
    roomSun = { light: sl, offset: built.sun.position };
  }
  applyEnvironment(cfg.env);
  scene.add(roomRoot);

  const box = new THREE.Box3().setFromObject(roomRoot);
  TUNE.exposure = DEFAULTS.exposure = cfg.exposure ?? 1.0;
  TUNE.charScale = DEFAULTS.charScale = cfg.charScale ?? 1.0;
  TUNE.camDist = DEFAULTS.camDist = cfg.camDist ?? 6.2;
  TUNE.envIntensity = DEFAULTS.envIntensity = cfg.env?.intensity ?? 1.0;
  TUNE.ambientIntensity = DEFAULTS.ambientIntensity = devLights.ambient?.intensity ?? 0;
  TUNE.hemiIntensity = DEFAULTS.hemiIntensity = devLights.hemi?.intensity ?? 0;
  TUNE.keyIntensity = DEFAULTS.keyIntensity = devLights.key?.intensity ?? 0;
  TUNE.fillIntensity = DEFAULTS.fillIntensity = devLights.fill?.intensity ?? 0;
  applyCharScale();
  baseFog = cfg.fog || [0x1a1710, 0.012];
  scene.fog = new THREE.FogExp2(baseFog[0], baseFog[1]*TUNE.fogDensity);
  scene.background = new THREE.Color(baseFog[0]);
  if (document.getElementById('tune').children.length) syncPanel();

  setProgress(0.9, 'finding the floor');
  await new Promise(r=>setTimeout(r,0));      // let the loader paint before the blocking pass
  /* A built room already knows its own shape, so it hands over an analytic
     collider — cheaper and exact. Loaded scenes have to have one inferred. */
  grid = built && built.collision
    ? { ...built.collision, cell: 1, nx: 0, nz: 0, floorY: new Float32Array(0),
        blocked: new Uint8Array(0), mode: 0,
        findSpawn: (x,z)=>[x,z] }
    : buildCollision(roomRoot, box);
  setProgress(0.98, 'stepping in');
  const [sx, sz] = grid.findSpawn(cfg.spawn[0], cfg.spawn[1]);
  pos.set(sx, grid.groundAt(sx, sz, box.min.y), sz);
  cameraAnchorY = pos.y;
  vel.set(0,0,0); vy = 0; grounded = true; windupT = 0; landT = 0;

  if (avatar && !avatar.parent) scene.add(avatar);
  if (blob && !blob.parent) scene.add(blob);
  camYaw = (cfg.camYaw !== undefined) ? cfg.camYaw : 0.6;
  camPitch = 0.16;
  // Place the camera outright — lerping from the previous room's position
  // means the first frames of a new room are framed from nowhere.
  {
    const snapY = (grid.ceiling !== null && grid.ceiling !== undefined)
      ? Math.min(pos.y + TUNE.camHeight + Math.sin(camPitch)*TUNE.camDist, grid.ceiling - 0.28)
      : pos.y + TUNE.camHeight + Math.sin(camPitch)*TUNE.camDist;
    camera.position.set(
      pos.x + Math.sin(camYaw)*Math.cos(camPitch)*TUNE.camDist, snapY,
      pos.z + Math.cos(camYaw)*Math.cos(camPitch)*TUNE.camDist);
  }
  camera.lookAt(pos.x, pos.y+1.2, pos.z);
  if (avatar) avatar.position.copy(pos);

  // stats
  let tris = 0, meshes = 0;
  roomRoot.traverse(o=>{ if(o.isMesh){ meshes++;
    const g=o.geometry, i=g.index; tris += (i? i.count : g.attributes.position.count)/3; } });
  let walk = 0; for (let i=0;i<grid.floorY.length;i++)
    if (isFinite(grid.floorY[i]) && !grid.blocked[i]) walk++;
  roomStats = `${cfg.label} · ${Math.round(tris).toLocaleString()} tris · ${meshes} meshes · ` +
              `${(walk*grid.cell*grid.cell).toFixed(0)} m² walkable${cfg.baked?' · baked/unlit':''}`;

  document.getElementById('credit').innerHTML = cfg.creditUrl
    ? `${cfg.label} — <a href="${cfg.creditUrl}" target="_blank" rel="noopener">${cfg.credit}</a>`
    : `${cfg.label} — ${cfg.credit}`;
  buildHud();
  flashHud();
  setProgress(1, 'here');
  // Not requestAnimationFrame: a backgrounded tab never fires it, so the
  // room would finish loading without ever capturing its card image.
  setTimeout(()=>{ try { captureThumb(key); } catch(e){} }, 80);
  setTimeout(hideLoader, 260);
}
let roomStats = '';

/* ========================== controller ========================= */
const COYOTE = 0.12, JUMP_BUFFER = 0.15, RADIUS = 0.34;
/* The Jump asset is a complete take-off / airborne / recovery performance.
   Its useful beats are at 0.42 s (feet leave the floor) and 1.58 s
   (feet make contact again). Drive those beats from the controller rather
   than abandoning the 2.2 s clip halfway through and starting the unrelated
   2.53 s Hard Landing clip at its airborne first frame. */
const JUMP_TAKEOFF = 0.42, JUMP_CONTACT = 1.58;
const UAL_TAKEOFF = 0.17, UAL_LAND_RECOVERY = 0.83;
const pos = new THREE.Vector3(), vel = new THREE.Vector3();
let vy = 0, grounded = true, heading = Math.PI, coyoteT = 0, jumpBufT = 0;
let windupT = 0, landT = 0, dancing = false, moonwalking = false;
let camYaw = 0.6, camPitch = 0.22, dragging = false, px = 0, py = 0;
let cameraAnchorY = 0, cameraXray = false;
const keys = {};

function setJumpPhase(phase){
  const a = actions.Jump;
  if (!a) return;
  const duration = a.getClip().duration || 2.2;
  if (phase === 'windup'){
    a.time = 0;
    a.timeScale = JUMP_TAKEOFF / Math.max(TUNE.jumpWindup, 0.05);
  } else if (phase === 'air'){
    a.time = JUMP_TAKEOFF;
    const flight = Math.max(0.1, 2*TUNE.jumpVel/Math.max(TUNE.gravity, 0.01));
    a.timeScale = (JUMP_CONTACT-JUMP_TAKEOFF) / flight;
  } else if (phase === 'land'){
    a.time = Math.min(JUMP_CONTACT, duration-0.01);
    a.timeScale = Math.max(0.01, duration-JUMP_CONTACT) / Math.max(TUNE.landHold, 0.05);
  }
}
function hasStagedJump(){
  return !!(actions.Jump_Start && actions.Jump_Loop && actions.Jump_Land);
}
function playJumpPhase(phase, fade=0.05){
  if (!hasStagedJump()){
    play('Jump', fade);
    setJumpPhase(phase === 'start' ? 'windup' : phase);
    return;
  }
  const name = phase === 'start' ? 'Jump_Start' : phase === 'air' ? 'Jump_Loop' : 'Jump_Land';
  play(name, fade);
  const action = actions[name];
  if (phase === 'start'){
    action.timeScale = UAL_TAKEOFF / Math.max(TUNE.jumpWindup, 0.05);
  } else if (phase === 'air'){
    action.timeScale = 1;
  } else {
    action.timeScale = Math.min(action.getClip().duration, UAL_LAND_RECOVERY) / Math.max(TUNE.landHold, 0.05);
  }
}

addEventListener('keydown', e=>{
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.code==='Backquote'){
    e.preventDefault();
    if (!e.repeat) showPanel(!panelShown);
    return;
  }
  if (e.code==='KeyX' && panelShown){
    e.preventDefault();
    if (!e.repeat) setCameraXray(!cameraXray);
    return;
  }
  const firstPress = !keys[e.code];
  keys[e.code] = true;
  if (e.code==='Space'){
    e.preventDefault();
    // Queue one jump per physical press. Refreshing this in tick() made a
    // held key survive the landing and immediately launch another jump.
    if (firstPress && !e.repeat) jumpBufT = JUMP_BUFFER;
    return;
  }
  // Movement remains held in `keys`, but one-shot controls must not toggle
  // repeatedly when the operating system starts key repeat.
  if (e.repeat) return;
  if (e.code==='KeyF'){ dancing = !dancing; moonwalking = false; }
  if (e.code==='KeyM'){ moonwalking = !moonwalking; dancing = false; }
  if (e.key==='Escape' && panelShown){ showPanel(false); return; }
  if (e.key==='?') flashHud();
  const k = (e.key||'').toLowerCase();
  if (/^[a-z]$/.test(k)){ typed = (typed+k).slice(-3); if (typed==='dev'){ showPanel(!panelShown); typed=''; } }
});
addEventListener('keyup', e=>keys[e.code]=false);
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{ if(!dragging)return;
  camYaw -= (e.clientX-px)*0.005;
  camPitch = THREE.MathUtils.clamp(camPitch + (e.clientY-py)*0.005, -0.30, 0.62);
  px=e.clientX; py=e.clientY; });
addEventListener('wheel',e=>{ TUNE.camDist = THREE.MathUtils.clamp(TUNE.camDist+e.deltaY*0.006,1.2,14);
                              syncPanel(); },{passive:true});

// Axis-separated so you slide along walls instead of sticking to them.
function moveWithCollision(dx, dz){
  const f = pos.y;
  if (grid.walkable(pos.x + dx + Math.sign(dx)*RADIUS, pos.z, f)) pos.x += dx;
  if (grid.walkable(pos.x, pos.z + dz + Math.sign(dz)*RADIUS, f)) pos.z += dz;
}

const clock = new THREE.Clock();
let elapsed = 0, frameAvg = 0.016, resTimer = 0;
/* Physics deliberately caps dt after a stall. FPS must not: measuring the
   capped value made a 200 ms hitch look like a healthy 20 fps frame. Keep a
   separate wall-clock window and report both average FPS and slow-frame cost. */
let perfLastMs = performance.now(), perfWindowMs = perfLastMs, perfFrames = 0;
const perfFrameTimes = [];
window.__rooms = { keys, pos, vel, TUNE, THREE, step:()=>tick(),
  get avatar(){return avatar;}, get _actions(){return actions;}, get _mixer(){return mixer;}, get offsets(){return clipGroundOffset;},
  get room(){return roomKey;}, get grid(){return grid;}, get stats(){return roomStats;},
  probe(){ return { pos:{x:+pos.x.toFixed(2),y:+pos.y.toFixed(2),z:+pos.z.toFixed(2)},
                    ground:+grid.groundAt(pos.x,pos.z,0).toFixed(2), grounded,
                    speed:+Math.hypot(vel.x,vel.z).toFixed(2), action:currentAction }; } };

/* A wall for camera purposes, as opposed to merely un-walkable ground. */
function occludes(x, z){
  if (!grid) return false;
  if (typeof grid.occludes === 'function') return grid.occludes(x, z);
  if (typeof grid.idx !== 'function' || !grid.blocked || !grid.blocked.length) return false;
  const k = grid.idx(x, z);
  if (k < 0) return true;          // outside the room's footprint is behind a wall
  return grid.blocked[k] === 1;
}

function tick(){
  const perfNow = performance.now();
  const rawFrameMs = perfNow - perfLastMs;
  perfLastMs = perfNow;
  if (rawFrameMs > 0 && rawFrameMs < 1000){
    perfFrameTimes.push(rawFrameMs);
    if (perfFrameTimes.length > 240) perfFrameTimes.shift();
  }
  perfFrames++;
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  if (!grid) { renderer.render(scene, camera); return; }

  const fwd = new THREE.Vector3(-Math.sin(camYaw),0,-Math.cos(camYaw));
  const right = new THREE.Vector3(-fwd.z,0,fwd.x);
  const wish = new THREE.Vector3();
  if (keys['KeyW']) wish.add(fwd);
  if (keys['KeyS']) wish.sub(fwd);
  if (keys['KeyD']) wish.add(right);
  if (keys['KeyA']) wish.sub(right);
  const emoting = dancing || moonwalking;
  const hasInput = wish.lengthSq()>0 && !emoting;
  if (hasInput) wish.normalize();
  const running = (keys['ShiftLeft']||keys['ShiftRight']) && hasInput;
  const targetSpeed = hasInput ? (running?TUNE.runSpeed:TUNE.walkSpeed) : 0;

  const target = wish.clone().multiplyScalar(targetSpeed);
  const rate = (grounded ? (hasInput?TUNE.accel:TUNE.decel) : TUNE.airAccel) * dt;
  vel.x += THREE.MathUtils.clamp(target.x-vel.x, -rate, rate);
  vel.z += THREE.MathUtils.clamp(target.z-vel.z, -rate, rate);
  moveWithCollision(vel.x*dt, vel.z*dt);

  jumpBufT = Math.max(0, jumpBufT-dt);
  coyoteT = grounded ? COYOTE : Math.max(0, coyoteT-dt);
  if (jumpBufT>0 && coyoteT>0 && windupT<=0 && grounded){
    // The Jump clip starts with the crouch and physical lift-off follows at
    // the same windup boundary. Its vertical root motion is flattened in the
    // asset, so physics is the single source of the character's height.
    windupT = Math.max(TUNE.jumpWindup, 1e-3);
    jumpBufT = 0; coyoteT = 0; landT = 0;
    playJumpPhase('start',0.05);
  }
  if (windupT>0){
    windupT -= dt;
    if (windupT<=0){
      vy = TUNE.jumpVel;
      grounded = false;
      playJumpPhase('air',0.06);
    }
  }

  const ground = grid.groundAt(pos.x, pos.z, pos.y);
  if (!grounded){
    vy -= TUNE.gravity*dt; pos.y += vy*dt;
    if (pos.y <= ground){
      pos.y = ground; vy = 0; grounded = true; landT = TUNE.landHold;
      // Jump already contains its own matching contact and recovery frames.
      // Continue that performance at the exact moment physics touches down.
      playJumpPhase('land',0.055);
    }
  } else {
    if (pos.y - ground > 0.45){
      grounded = false; vy = 0;
      // Walking off a ledge enters the airborne portion directly: replaying
      // the crouch while already falling looks like a second phantom jump.
      playJumpPhase('air',0.08);
    } else pos.y = ground;
  }
  if (landT>0) landT -= dt;

  if (avatar){
    const speed = Math.hypot(vel.x, vel.z);
    if (hasInput) heading = Math.atan2(wish.x, wish.z);
    else if (speed>0.4) heading = Math.atan2(vel.x, vel.z);
    let d = heading - avatar.rotation.y;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    avatar.rotation.y += d * Math.min(1, TUNE.turnRate*dt);

    if (mixer){
      if (windupT>0) play(hasStagedJump()?'Jump_Start':'Jump',0.05);
      else if (!grounded) play(hasStagedJump()?'Jump_Loop':'Jump',0.05);
      else if (landT>0) play(hasStagedJump()?'Jump_Land':'Jump',0.04);
      else if (moonwalking && actions.Moonwalk) play('Moonwalk');
      else if (dancing && actions.Dance) play('Dance');
      else if (hasInput){
        const nm = (running && actions.Run) ? 'Run' : 'Walk';
        play(nm);
        if (nominal[nm]) actions[nm].timeScale =
          THREE.MathUtils.clamp((Math.max(speed,targetSpeed*0.35)/nominal[nm])*TUNE.animRate, 0.45, 2.6);
      }
      else if (actions.Idle) play('Idle');
    }
    avatar.position.copy(pos);
    mixer.update(dt);
    retireFadedActions();

    /* Constant per-clip ground offset rather than a per-frame correction —
       correcting every frame cancels the gait's rise and reads as a limp. */
    if (currentAction){
      const target = (clipGroundOffset[currentAction] ?? baseModelY) - SOLE_GAP;
      groundOffsetY += (target - groundOffsetY) * Math.min(1, 10*dt);
      avatar.children[0].position.y = groundOffsetY;
    }
    if (blob){
      blob.position.set(pos.x, ground + 0.012, pos.z);
      const air = THREE.MathUtils.clamp(pos.y - ground, 0, 2.5);
      const k = 1 - air/2.5;
      blob.scale.setScalar(0.75 + 0.45*k);
      blob.material.opacity = 0.25 + 0.6*k;
    }
  }

  /* Camera: pull in when the ideal position would sit inside geometry —
     the grid already knows what's solid, so no raycast needed. */
  /* March out along the boom and stop at the first solid cell. Testing only
     the boom's endpoint lets a wall sit between camera and character — the
     endpoint can be in open space on the far side of it. */
  /* March out along the boom and stop at the first wall. Testing only the
     endpoint lets a wall sit between camera and character. "Not walkable"
     is too strict a test though — the camera rides above head height and may
     legitimately pass over a ledge or the lip of a pool, so only geometry
     tall enough to actually block the view counts. */
  let dist = TUNE.camDist;
  if (!cameraXray){
    const step = Math.max(0.25, (grid.cell || 0.4) * 0.8);
    const dx = Math.sin(camYaw)*Math.cos(camPitch), dz = Math.cos(camYaw)*Math.cos(camPitch);
    const MIN = Math.min(0.72, TUNE.camDist);
    // Give the camera a little width: testing only its centre lets thin
    // corners clip through the edge of the frame while orbiting a wall.
    const shoulder = 0.26, sideX = dz*shoulder, sideZ = -dx*shoulder;
    for (let d = MIN; d <= TUNE.camDist; d += step){
      const x = pos.x + dx*d, z = pos.z + dz*d;
      if (occludes(x,z) || occludes(x+sideX,z+sideZ) || occludes(x-sideX,z-sideZ)){
        dist = Math.max(MIN, d - step);
        break;
      }
    }
  }
  /* Follow the ground/jump height through a separate damped anchor. Feeding
     the raw player Y into both the boom and look-at point made every small
     terrain sample read as camera bob, even though the avatar was stable. */
  const anchorRate = grounded ? 7.5 : 4.0;
  cameraAnchorY += (pos.y - cameraAnchorY) * (1 - Math.exp(-anchorRate*dt));
  const cx = pos.x + Math.sin(camYaw)*Math.cos(camPitch)*dist;
  const cz = pos.z + Math.cos(camYaw)*Math.cos(camPitch)*dist;
  let cy = cameraAnchorY + TUNE.camHeight + Math.sin(camPitch)*dist;
  // Indoors the boom would otherwise rise straight through the ceiling and
  // look down on the level from outside it.
  if (!cameraXray && grid.ceiling !== null && grid.ceiling !== undefined)
    cy = Math.min(cy, grid.ceiling - 0.28);
  camera.position.lerp(new THREE.Vector3(cx,cy,cz), Math.min(1,14*dt));
  camera.lookAt(pos.x, cameraAnchorY+1.2, pos.z);

  if (roomUpdate) roomUpdate(dt, pos);
  if (roomSun){
    roomSun.light.position.set(pos.x+roomSun.offset[0], pos.y+roomSun.offset[1], pos.z+roomSun.offset[2]);
    roomSun.light.target.position.copy(pos);
    roomSun.light.target.updateMatrixWorld();
  }
  renderer.toneMappingExposure = TUNE.exposure;
  if (scene.fog) scene.fog.density = baseFog[1]*TUNE.fogDensity;
  scene.environmentIntensity = TUNE.envIntensity;
  if (devLights.ambient) devLights.ambient.intensity = TUNE.ambientIntensity;
  if (devLights.hemi) devLights.hemi.intensity = TUNE.hemiIntensity;
  if (devLights.key) devLights.key.intensity = TUNE.keyIntensity;
  if (devLights.fill) devLights.fill.intensity = TUNE.fillIntensity;

  renderer.render(scene, camera);

  /* Dynamic resolution: hold the frame budget and spend whatever pixels are
     left. A fanless laptop throttles rather than dropping a fixed amount, so
     a static pixel ratio either wastes headroom or falls off a cliff. */
  frameAvg += (dt - frameAvg) * 0.05;
  resTimer += dt;
  if (resTimer > 0.9){
    resTimer = 0;
    const target = Math.min(devicePixelRatio, 1.35);
    if (frameAvg > 0.0215 && pixelScale > 0.75){
      pixelScale = Math.max(0.75, pixelScale - 0.15); renderer.setPixelRatio(pixelScale);
    } else if (frameAvg < 0.0145 && pixelScale < target){
      pixelScale = Math.min(target, pixelScale + 0.1); renderer.setPixelRatio(pixelScale);
    }
  }

  const perfSpan = perfNow - perfWindowMs;
  if (perfSpan >= 900){
    const fps = perfFrames * 1000 / perfSpan;
    const recent = perfFrameTimes.slice().sort((a,b)=>a-b);
    const avgMs = perfFrameTimes.reduce((sum,v)=>sum+v,0) / Math.max(1,perfFrameTimes.length);
    const p99Ms = recent[Math.min(recent.length-1, Math.floor(recent.length*.99))] || avgMs;
    const low = 1000 / Math.max(0.01,p99Ms);
    document.getElementById('perf').textContent =
      `${fps.toFixed(0)} fps · ${avgMs.toFixed(1)} ms · 1% low ${low.toFixed(0)} · ${renderer.info.render.calls} calls`;
    perfFrames = 0; perfWindowMs = perfNow;
  }
}

/* ============================== UI =============================
   Loader art is drawn on a 2D canvas rather than in WebGL: it has to run
   *before* the renderer has anything to show, and a wireframe projected by
   hand costs nothing while the GPU is busy decoding textures. */
const loadArt = document.getElementById('loadArt');
const artCtx = loadArt.getContext('2d');
let artT = 0, artRAF = 0, artProgress = 0;

/* Slow-drifting soft forms — the same weather as the transition, so the
   loader and the room change feel like one gesture rather than two effects. */
const BLOBS = Array.from({length:5}, (_,i)=>({
  a: (i/5)*Math.PI*2,
  r: 26 + i*7,
  s: 34 + (i%3)*13,
  sp: 0.16 + i*0.045,
}));

function drawArt(){
  const w = loadArt.width, h = loadArt.height, cx = w/2, cy = h/2;
  artCtx.clearRect(0,0,w,h);
  artT += 0.006;

  for (const b of BLOBS){
    const a = b.a + artT*b.sp;
    const x = cx + Math.cos(a)*b.r, y = cy + Math.sin(a*1.3)*b.r*0.62;
    const g = artCtx.createRadialGradient(x,y,0, x,y,b.s);
    g.addColorStop(0,   'rgba(255,255,255,0.95)');
    g.addColorStop(0.45,'rgba(244,239,230,0.55)');
    g.addColorStop(1,   'rgba(228,220,208,0)');
    artCtx.fillStyle = g;
    artCtx.beginPath(); artCtx.arc(x,y,b.s,0,Math.PI*2); artCtx.fill();
  }

  // a single hairline ring carrying progress, drawn over the weather
  artCtx.lineWidth = 1.25;
  artCtx.strokeStyle = 'rgba(44,39,34,.13)';
  artCtx.beginPath(); artCtx.arc(cx,cy,86,0,Math.PI*2); artCtx.stroke();
  artCtx.strokeStyle = 'rgba(44,39,34,.5)';
  artCtx.beginPath();
  artCtx.arc(cx,cy,86, -Math.PI/2, -Math.PI/2 + Math.PI*2*artProgress);
  artCtx.stroke();

  artRAF = requestAnimationFrame(drawArt);
}
function startArt(){ if (!artRAF) drawArt(); }
function stopArt(){ cancelAnimationFrame(artRAF); artRAF = 0; }

function setProgress(p, phase){
  artProgress = THREE.MathUtils.clamp(p, 0, 1);
  const value = (artProgress*100).toFixed(0)+'%';
  document.getElementById('loadBar').style.width = value;
  document.getElementById('loadPct').textContent = value;
  document.getElementById('wipeBar').style.width = value;
  document.getElementById('wipePct').textContent = value;
  if (phase){
    document.getElementById('loadPhase').textContent = phase;
    document.getElementById('wipePhase').textContent = phase;
  }
}
function showLoader(name){
  document.getElementById('loadName').textContent = name;
  // A world-to-world trip is already held by #wipe. Reopening the full
  // launch screen here caused the duplicate flash the old build exposed.
  if (switching) return;
  document.getElementById('load').classList.remove('hide');
  startArt();
}
function hideLoader(){
  document.getElementById('load').classList.add('hide');
  setTimeout(stopArt, 600);
}
