/* Room thumbnails.

   Every published room has a bundled first-visit image. Once a room has
   rendered on this device, a fresh in-world capture replaces that fallback
   in localStorage, so cards remain representative as the worlds evolve. */
const DEFAULT_THUMBS = Object.freeze({
  dune: 'assets/thumbnails/dune.jpg',
  level0: 'assets/thumbnails/level0.jpg',
  backrooms: 'assets/thumbnails/backrooms.jpg',
  lobby: 'assets/thumbnails/lobby.jpg',
  pool: 'assets/thumbnails/pool.jpg',
  dreamcore: 'assets/thumbnails/dreamcore.jpg',
});
const THUMB_KEY = 'sansara.thumbs.v2';
let thumbs = {};
try { thumbs = JSON.parse(localStorage.getItem(THUMB_KEY) || '{}'); } catch(e){ thumbs = {}; }
const thumbFor = key => thumbs[key] || DEFAULT_THUMBS[key] || null;

// Decode the small card images before the selector opens. Browsers keep the
// results in their image cache; no layout or paint is held up by this work.
for (const src of Object.values(DEFAULT_THUMBS)){
  const image = new Image();
  image.decoding = 'async';
  image.src = src;
  image.decode?.().catch(()=>{});
}

function captureThumb(key){
  if (!scene || !roomRoot) return;
  const wasVisible = avatar ? avatar.visible : false;
  const blobVisible = blob ? blob.visible : false;
  if (avatar) avatar.visible = false;
  if (blob) blob.visible = false;

  const prevRatio = renderer.getPixelRatio();
  const shotCam = camera.clone();
  shotCam.fov = 58; shotCam.aspect = 186/238; shotCam.updateProjectionMatrix();
  // Use the camera's resolved, collision-safe composition. The old generic
  // offset could land behind a wall in short rooms (most visibly the pool).
  shotCam.updateMatrixWorld(true);

  const rt = new THREE.WebGLRenderTarget(248, 318, { colorSpace: THREE.SRGBColorSpace });
  renderer.setRenderTarget(rt);
  renderer.render(scene, shotCam);
  renderer.setRenderTarget(null);

  const buf = new Uint8Array(248*318*4);
  renderer.readRenderTargetPixels(rt, 0, 0, 248, 318, buf);
  const cv = document.createElement('canvas'); cv.width = 248; cv.height = 318;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(248, 318);
  // readRenderTargetPixels hands back bottom-up rows
  for (let y=0;y<318;y++){
    const src = (317-y)*248*4, dst = y*248*4;
    img.data.set(buf.subarray(src, src+248*4), dst);
  }
  ctx.putImageData(img,0,0);
  rt.dispose();
  renderer.setPixelRatio(prevRatio);
  if (avatar) avatar.visible = wasVisible;
  if (blob) blob.visible = blobVisible;

  try {
    thumbs[key] = cv.toDataURL('image/jpeg', 0.5);
    localStorage.setItem(THUMB_KEY, JSON.stringify(thumbs));
  } catch(e){ /* quota or tainted canvas: cards fall back to their tint */ }
}

window.__thumbOf = thumbFor;

/* ============================ travel ===========================
   Rooms aren't a menu of files, they're places. Holding Tab lifts you out:
   the world goes behind glass and the other places present themselves.
   Arrows or the mouse choose, releasing Tab commits. Clicking a card works
   too, for anyone who'd rather not hold a key down. */
/* One scene is licensed for use but not for redistribution, so it's absent
   from the published build and present when running locally. */
const IS_LOCAL = ['localhost','127.0.0.1',''].includes(location.hostname);
const REDUCE_MOTION = matchMedia('(prefers-reduced-motion: reduce)');
const roomKeys = ()=>Object.keys(ROOMS).filter(k=>IS_LOCAL || !ROOMS[k].local);
let travelOpen = false, travelIdx = 0, switching = false, travelCommitted = false;
let pointerX = NaN, pointerY = NaN, travelInput = 'keyboard';

/* A tiny synthesized glass chime keeps the selector responsive without
   shipping another asset. Every gain starts and ends above zero with a short
   ramp, avoiding clicks; the context is created only from user input. */
let travelAudio = null, lastMoveSound = 0;
function audioReady(){
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return null;
  if (!travelAudio){
    try { travelAudio = new AudioCtx({ latencyHint:'interactive' }); }
    catch(e){ travelAudio = new AudioCtx(); }
  }
  if (travelAudio.state === 'suspended') travelAudio.resume().catch(()=>{});
  return travelAudio;
}
function chimeTone(ctx, frequency, start, duration, peak, type='sine'){
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(frequency, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(peak, start + Math.min(.012, duration*.2));
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(start); osc.stop(start + duration + .02);
}
function soundMove(){
  const ctx = audioReady();
  if (!ctx || ctx.currentTime - lastMoveSound < .045) return;
  const t = ctx.currentTime + .004;
  lastMoveSound = t;
  chimeTone(ctx, 659.25, t, .105, .018, 'sine');
  chimeTone(ctx, 987.77, t+.012, .075, .007, 'triangle');
}
function soundEnter(){
  const ctx = audioReady();
  if (!ctx) return;
  const t = ctx.currentTime + .006;
  [[392,.032,0],[493.88,.024,.035],[659.25,.018,.075]].forEach(([f,g,d])=>
    chimeTone(ctx, f, t+d, .42-d*.7, g, 'sine'));
}

// Remember the last *physical* pointer position while the selector is shut.
// Layout motion can emit pointer events without movement; those must never
// steal a keyboard selection back to the card under a stationary cursor.
addEventListener('pointermove', e=>{
  if (!travelOpen){ pointerX = e.clientX; pointerY = e.clientY; }
}, { passive:true });

function tintFor(k){
  return ({ dune:'#e7c78d', level0:'#b3a55c', backrooms:'#e2c98f',
            lobby:'#d9b98a', pool:'#bcd6e2', dreamcore:'#b9c8a6' })[k] || '#ddd6c8';
}
function markSelected(scroll=false){
  const cards = document.querySelectorAll('#rail .card');
  cards.forEach((el,i)=>{
    el.classList.toggle('sel', i===travelIdx);
    el.setAttribute('aria-pressed', String(i===travelIdx));
    if (scroll && i===travelIdx){
      const rail = document.getElementById('rail');
      const left = el.offsetLeft - (rail.clientWidth - el.offsetWidth)/2;
      rail.scrollTo({ left, behavior:REDUCE_MOTION.matches?'auto':'smooth' });
    }
  });
  const keys = roomKeys(), chosen = keys[travelIdx];
  document.getElementById('travelCount').textContent = chosen
    ? `${String(travelIdx+1).padStart(2,'0')} / ${String(keys.length).padStart(2,'0')}  ·  ${ROOMS[chosen].label}`
    : '';
}
function selectTravel(i, {scroll=false, sound=true, source='keyboard'}={}){
  const count = roomKeys().length;
  if (!count) return;
  const next = (i % count + count) % count;
  if (next === travelIdx) return;
  travelInput = source;
  travelIdx = next;
  markSelected(scroll);
  if (sound) soundMove();
}
function buildTravel(){
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  roomKeys().forEach((k,i)=>{
    const cfg = ROOMS[k];
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'card' + (k===roomKey ? ' here' : '') + (i===travelIdx ? ' sel' : '');
    el.setAttribute('aria-label', `${cfg.label}. ${cfg.blurb || ''}`);
    if (k===roomKey) el.setAttribute('aria-current','true');
    el.style.setProperty('--tint', cfg.tint || tintFor(k));
    const shot = thumbFor(k);
    el.innerHTML = `<span class="swatch${shot?' shot':''}"${shot?` style="--shot:url('${shot}')"`:''}></span>
      <span class="veil"></span>
      <span class="idx">${String(i+1).padStart(2,'0')}</span>
      <span class="txt"><span class="nm">${cfg.label}</span>
      <span class="bl">${cfg.blurb || ''}</span></span>`;
    el.onclick = ()=>commitTravel(k);
    el.onpointerdown = ()=>{ travelInput = 'pointer'; audioReady(); };
    el.onpointermove = e=>{
      if (!Number.isFinite(pointerX)){ pointerX=e.clientX; pointerY=e.clientY; return; }
      // Keyboard mode deliberately needs a larger physical gesture, so tiny
      // trackpad jitter cannot steal the highlight immediately after an arrow.
      const threshold = travelInput === 'keyboard' ? 10 : 2;
      if (Math.hypot(e.clientX-pointerX, e.clientY-pointerY) <= threshold) return;
      pointerX = e.clientX; pointerY = e.clientY;
      selectTravel(i, {source:'pointer'});
    };
    rail.appendChild(el);
  });
  markSelected();
}
function openTravel(){
  if (travelOpen || switching) return;
  if (panelShown) showPanel(false);
  travelOpen = true;
  travelCommitted = false;
  travelInput = 'keyboard';
  travelIdx = Math.max(0, roomKeys().indexOf(roomKey));
  buildTravel();
  const travel = document.getElementById('travel');
  travel.classList.add('on');
  travel.setAttribute('aria-hidden','false');
  document.getElementById('hud').classList.remove('show');
}
function closeTravel(){
  travelOpen = false;
  const travel = document.getElementById('travel');
  travel.classList.remove('on');
  travel.setAttribute('aria-hidden','true');
}
function commitTravel(k){
  if (!travelOpen || travelCommitted || switching || !ROOMS[k]) return;
  travelCommitted = true;
  closeTravel();
  if (k === roomKey) return;
  soundEnter();
  goTo(k);
}
async function goTo(k){
  if (k === roomKey || switching || !ROOMS[k]) return;
  switching = true;
  const wipe = document.getElementById('wipe');
  const shot = thumbFor(k), tint = ROOMS[k].tint || tintFor(k);
  wipe.style.setProperty('--wipe-tint', tint);
  wipe.style.setProperty('--wipe-image', shot
    ? `url("${shot}")`
    : `radial-gradient(circle at 35% 24%, rgba(255,255,255,.95), transparent 34%), linear-gradient(155deg, ${tint}, #dbe8ff)`);
  document.getElementById('wipeName').textContent = ROOMS[k].label;
  wipe.classList.remove('reveal');
  // Restart the aperture animation even when two changes happen quickly.
  void wipe.offsetWidth;
  wipe.classList.add('on');
  try {
    await new Promise(r=>setTimeout(r, REDUCE_MOTION.matches ? 40 : 760));
    // Keep one uninterrupted transition on screen; loadRoom feeds its real
    // progress into this layer instead of opening a second loader beneath it.
    wipe.classList.add('loading');
    roomKey = k;
    history.replaceState(null,'',`?room=${k}`);
    await loadRoom(k);
    wipe.classList.add('reveal');
    await new Promise(r=>setTimeout(r, REDUCE_MOTION.matches ? 60 : 720));
    flashHud(2600);
  } finally {
    wipe.classList.remove('on','reveal','loading');
    switching = false;
  }
}

addEventListener('keydown', e=>{
  if (e.code === 'Tab'){ e.preventDefault(); audioReady(); openTravel(); return; }
  if (!travelOpen) return;
  const ks = roomKeys();
  if (e.code === 'ArrowRight'){ selectTravel(travelIdx+1, {scroll:true}); e.preventDefault(); }
  if (e.code === 'ArrowLeft'){ selectTravel(travelIdx-1, {scroll:true}); e.preventDefault(); }
  if (e.code === 'Escape'){ closeTravel(); e.preventDefault(); }
  if (e.code === 'Enter'){ commitTravel(ks[travelIdx]); e.preventDefault(); }
});
addEventListener('keyup', e=>{
  if (e.code !== 'Tab' || !travelOpen) return;
  const k = roomKeys()[travelIdx];
  commitTravel(k);
});
// Keys must not stay stuck down when focus leaves the page.
addEventListener('blur', ()=>{
  for (const k in keys) keys[k] = false;
  jumpBufT = 0;
  if (travelOpen) closeTravel();
});
addEventListener('visibilitychange', ()=>{
  // A background tab may be throttled for seconds. Start a clean measurement
  // on return rather than poisoning the visible FPS window with hidden time.
  if (!document.hidden){
    perfLastMs = perfWindowMs = performance.now();
    perfFrames = 0; perfFrameTimes.length = 0;
    clock.getDelta();
  }
});

let panelShown = false, typed = '';
function setCameraXray(on){
  // X-ray is a development inspection aid, never a normal camera state.
  cameraXray = !!on && panelShown;
  const b = document.getElementById('xrayToggle');
  if (b){ b.setAttribute('aria-pressed', String(cameraXray)); b.textContent = cameraXray ? 'X-ray on' : 'X-ray off'; }
}
function showPanel(on){
  panelShown = on;
  document.getElementById('tune').classList.toggle('shown', on);
  if (!on) setCameraXray(false);
}
function tuneSnapshot(){
  return `TUNE {\n${TUNE_SPEC.map(([k])=>`  ${k}: ${TUNE[k]},`).join('\n')}\n}`;
}
function syncPanel(){
  const title = document.getElementById('lookTitle');
  if (title) title.textContent = `World atmosphere · ${ROOMS[roomKey].label}`;
  document.querySelectorAll('#tune input[type=range]').forEach(i=>{
    i.value = TUNE[i.dataset.key];
    i.parentElement.querySelector('output').textContent = TUNE[i.dataset.key];
  });
  const colors = {
    fog: scene?.fog?.color, ambient:devLights.ambient?.color,
    sky:devLights.hemi?.color, ground:devLights.hemi?.groundColor,
    key:devLights.key?.color, fill:devLights.fill?.color,
  };
  document.querySelectorAll('#tune input[type=color]').forEach(i=>{
    const c = colors[i.dataset.look];
    if (c) i.value = '#' + c.getHexString();
  });
}
function buildPanel(){
  const panel = document.getElementById('tune');
  const worldKeys = new Set(['exposure','fogDensity','envIntensity','ambientIntensity','hemiIntensity','keyIntensity','fillIntensity']);
  const sliders = specs => specs.map(([k,label,min,max,step])=>`
      <label><span>${label}</span>
        <input type="range" min="${min}" max="${max}" step="${step}" value="${TUNE[k]}" data-key="${k}">
        <output>${TUNE[k]}</output></label>`).join('');
  panel.innerHTML = `<div class="ph"><b>Development</b><button id="tuneToggle" title="press backquote to reopen">×</button></div>
    <div class="pb"><div class="devcam"><b>Camera inspection</b>
      <button id="xrayToggle" type="button" aria-pressed="false">X-ray off</button>
      <small>Press X while this panel is open. Closing Dev Mode restores solid scene occlusion.</small></div>
      <div class="psection" id="lookTitle">World atmosphere · ${ROOMS[roomKey].label}</div>
      <div class="look-colors">
        <label><span>Fog / backdrop</span><input type="color" data-look="fog"></label>
        <label><span>Ambient color</span><input type="color" data-look="ambient"></label>
        <label><span>Sky color</span><input type="color" data-look="sky"></label>
        <label><span>Ground color</span><input type="color" data-look="ground"></label>
        <label><span>Key color</span><input type="color" data-look="key"></label>
        <label><span>Fill color</span><input type="color" data-look="fill"></label>
      </div>
      ${sliders(TUNE_SPEC.filter(([k])=>worldKeys.has(k)))}
      <div class="psection">Movement & camera</div>
      ${sliders(TUNE_SPEC.filter(([k])=>!worldKeys.has(k)))}
      <div class="pact"><button id="tuneCopy">Copy to clipboard</button>
        <button id="tuneReset">reset</button></div>
      <textarea class="pcopy" id="tuneOut" rows="8" readonly></textarea>
    </div>`;
  panel.addEventListener('input', e=>{
    const look = e.target.dataset.look;
    if (look){
      const c = new THREE.Color(e.target.value);
      if (look === 'fog'){
        baseFog[0] = c.getHex();
        scene.background?.copy(c); scene.fog?.color.copy(c);
      } else if (look === 'ambient') devLights.ambient?.color.copy(c);
      else if (look === 'sky') devLights.hemi?.color.copy(c);
      else if (look === 'ground') devLights.hemi?.groundColor.copy(c);
      else if (look === 'key') devLights.key?.color.copy(c);
      else if (look === 'fill') devLights.fill?.color.copy(c);
      return;
    }
    const k = e.target.dataset.key; if (!k) return;
    TUNE[k] = parseFloat(e.target.value);
    e.target.parentElement.querySelector('output').textContent = TUNE[k];
    if (k === 'charScale') applyCharScale();
  });
  document.getElementById('tuneToggle').onclick = ()=>showPanel(false);
  document.getElementById('xrayToggle').onclick = ()=>setCameraXray(!cameraXray);
  document.getElementById('tuneReset').onclick = ()=>{
    Object.assign(TUNE, DEFAULTS);
    const cfg = ROOMS[roomKey], fog = new THREE.Color(cfg.fog?.[0] ?? 0x1a1710);
    baseFog[0] = fog.getHex(); scene.background?.copy(fog); scene.fog?.color.copy(fog);
    const lc = cfg.charLight, ll = cfg.lights;
    devLights.ambient?.color.set(lc?.sky ?? 0xffffff);
    devLights.hemi?.color.set(lc?.sky ?? ll?.sky ?? 0xffffff);
    devLights.hemi?.groundColor.set(lc?.ground ?? ll?.ground ?? 0x888888);
    // `lights.dir` is an intensity, whereas `charLight.dir` is a color.
    devLights.key?.color.set(lc?.dir ?? 0xfff4e2);
    devLights.fill?.color.set(lc?.sky ?? ll?.sky ?? 0xffffff);
    syncPanel();
  };
  document.getElementById('tuneCopy').onclick = async ()=>{
    const txt = tuneSnapshot(), b = document.getElementById('tuneCopy'), out = document.getElementById('tuneOut');
    let ok = false;
    try { await navigator.clipboard.writeText(txt); ok = true; }
    catch(e){ out.value = txt; out.style.display='block'; out.select();
              try { ok = document.execCommand('copy'); } catch(_){} }
    b.textContent = ok ? 'Copied ✓' : 'Select & copy ↓';
    setTimeout(()=>b.textContent='Copy to clipboard', 1600);
  };
}

function safeTick(){
  try { tick(); }
  catch(err){ renderer.setAnimationLoop(null);
    document.getElementById('load').classList.remove('hide');
    document.getElementById('load').textContent = 'loop error: ' + err.message;
    console.error(err); }
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

(async ()=>{
  try {
    scene = new THREE.Scene();
    await loadAvatar();
    await loadRoom(roomKey);
    buildPanel();
    renderer.setAnimationLoop(safeTick);
  } catch(err){
    document.getElementById('load').textContent = 'startup error: ' + err.message;
    console.error(err);
  }
})();
</script>
</body>
</html>
