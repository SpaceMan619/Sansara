<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sikh Avatar — Animation Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; overflow:hidden; color:#263451; font:13px/1.4 system-ui,-apple-system,sans-serif;
         background:radial-gradient(circle at 18% 14%,#fff 0,transparent 34%),#eaf2ff; }
  body::after{ content:''; position:fixed; inset:0; pointer-events:none;
         background:linear-gradient(135deg,rgba(255,255,255,.38),transparent 52%); z-index:1; }
  #ui { position:fixed; top:18px; left:50%; transform:translateX(-50%); display:flex; flex-wrap:wrap;
        justify-content:center; gap:7px; z-index:2; width:min(92vw,920px); padding:9px;
        border:1px solid rgba(255,255,255,.78); border-radius:22px;
        background:rgba(248,251,255,.58); backdrop-filter:blur(20px) saturate(145%);
        box-shadow:0 18px 56px rgba(78,108,164,.14); }
  button { background:rgba(255,255,255,.46); color:#4c5d7c; border:1px solid rgba(108,139,194,.18);
           border-radius:999px; padding:7px 13px; cursor:pointer; font:inherit;
           transition:transform .2s ease,background .2s ease,color .2s ease,box-shadow .2s ease; }
  button:hover{ transform:translateY(-1px); background:rgba(255,255,255,.8); }
  button.active { background:#fff; border-color:rgba(108,139,194,.42); color:#263451;
                  box-shadow:0 7px 20px rgba(78,108,164,.16); }
  button:focus-visible{ outline:2px solid #82a8ec; outline-offset:2px; }
  #status { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:2;
            padding:7px 13px; border-radius:999px; color:rgba(38,52,81,.62);
            background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.72);
            backdrop-filter:blur(14px); }
  @media (prefers-reduced-motion:reduce){ button{ transition:none; } }
</style>
</head>
<body>
<div id="ui"></div>
<div id="status">loading…</div>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Thermal-safe settings for the fanless M4 Air: pixelRatio 1, no shadows, no post.
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeaf2ff);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0, 1.4, 3);

scene.add(new THREE.HemisphereLight(0xf6fbff, 0x9aa9bf, 1.45));
const key = new THREE.DirectionalLight(0xffffff, 1.65);
key.position.set(2, 4, 3);
scene.add(key);
scene.add(new THREE.GridHelper(6, 12, 0x9eb9df, 0xcbd9ec));

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);

const clock = new THREE.Clock();
let mixer, actions = {}, current;
const fadingOut = new Map();

new GLTFLoader().load('./output/minimal-scifi-sikh-animated.glb?v=4', (gltf) => {
  scene.add(gltf.scene);
  mixer = new THREE.AnimationMixer(gltf.scene);
  const ui = document.getElementById('ui');
  for (const clip of gltf.animations) {
    actions[clip.name] = mixer.clipAction(clip);
    const b = document.createElement('button');
    b.textContent = clip.name;
    b.onclick = () => play(clip.name);
    ui.appendChild(b);
  }
  document.getElementById('status').textContent =
    `${gltf.animations.length} clips loaded`;
  play(gltf.animations[0]?.name);
}, undefined, (e) => {
  document.getElementById('status').textContent = 'load error: ' + e.message;
});

function play(name) {
  if (!name || !actions[name]) return;
  const next = actions[name], prev = current ? actions[current] : null;
  next.enabled = true;
  next.setEffectiveWeight(1);
  next.reset().play();
  fadingOut.delete(next);
  if (prev && prev !== next) {
    next.crossFadeFrom(prev, 0.25, false);
    fadingOut.set(prev, performance.now() + 370);
  }
  for (const action of Object.values(actions)) {
    if (action === next || action === prev) continue;
    if (action.isRunning() || action.getEffectiveWeight() > 0.001)
      fadingOut.set(action, performance.now() + 370);
  }
  current = name;
  document.querySelectorAll('#ui button').forEach(b =>
    b.classList.toggle('active', b.textContent === name));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  mixer?.update(clock.getDelta());
  const now = performance.now();
  for (const [action, deadline] of fadingOut) {
    if (now < deadline && action.getEffectiveWeight() >= 0.005) continue;
    action.stop();
    action.enabled = false;
    action.setEffectiveWeight(0);
    fadingOut.delete(action);
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
