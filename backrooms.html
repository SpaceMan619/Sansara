<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1">

  body{ margin:0; background:#0b0a06; overflow:hidden; font:13px/1.5 system-ui,-apple-system,sans-serif; }
  #hud{ position:fixed; top:18px; left:50%; transform:translateX(-50%); color:#33415f;
        background:rgba(249,252,255,.62); backdrop-filter:blur(18px) saturate(145%);
        padding:9px 16px; border-radius:999px; z-index:2; white-space:nowrap;
        border:1px solid rgba(255,255,255,.78); box-shadow:0 14px 42px rgba(35,34,24,.18); }
  #hud b{ color:#22304f; }
  #status,#perf{ position:fixed; bottom:14px; color:rgba(246,250,255,.82); opacity:.78; z-index:2;
                text-shadow:0 1px 4px rgba(0,0,0,.46); }

  /* Vignette as a DOM overlay — zero GPU cost, and it does what a
     post-processing pass would do for the frame edge. */

        background:radial-gradient(ellipse at 50% 48%,
          rgba(0,0,0,0) 46%, rgba(0,0,0,0.16) 80%, rgba(0,0,0,0.38) 100%); }

<body>
<div id="hud"><b>WASD</b> move · <b>Shift</b> run · <b>Space</b> jump · drag to look · <a href="index.html">← back</a></div>
<div id="vig"></div>
<div id="status">loading…</div>
<div id="perf"></div>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ========================= layout ==========================
   A grid maze carved by random-walk "corridors" rather than a
   perfect maze: Level 0 should read as a badly-partitioned office
   floor — long sightlines, dead ends, and rooms that open into
   rooms — not a puzzle. */
const GRID = 42, CELL = 6, WALL_H = 7.5;   // tall ceilings: the defining feature
const HALF = GRID*CELL/2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand = mulberry32(90210);

const open = new Uint8Array(GRID*GRID);          // 1 = walkable
const at = (x,y)=> (x<0||y<0||x>=GRID||y>=GRID) ? 0 : open[y*GRID+x];
function carve(){
  let x = GRID>>1, y = GRID>>1;
  for (let i=0;i<GRID*GRID*0.11;i++){
    open[y*GRID+x] = 1;
    // Long straight runs, occasional turn — produces corridors, not noise.
    if (rand() < 0.22){ const d = rand()<0.5 ? 1 : -1; if (rand()<0.5) x+=d; else y+=d; }
    else { const run = 2 + Math.floor(rand()*5);
           const horiz = rand()<0.5, d = rand()<0.5 ? 1 : -1;
           for (let s=0;s<run;s++){ if (horiz) x+=d; else y+=d;
             x=THREE.MathUtils.clamp(x,1,GRID-2); y=THREE.MathUtils.clamp(y,1,GRID-2);
             open[y*GRID+x]=1; } }
    x=THREE.MathUtils.clamp(x,1,GRID-2); y=THREE.MathUtils.clamp(y,1,GRID-2);
  }
  // Punch out a few open rooms so it isn't corridors all the way down
  for (let r=0;r<7;r++){
    const w=2+Math.floor(rand()*3), h=2+Math.floor(rand()*3);
    const ox=1+Math.floor(rand()*(GRID-w-2)), oy=1+Math.floor(rand()*(GRID-h-2));
    for(let j=0;j<h;j++) for(let i=0;i<w;i++) open[(oy+j)*GRID+ox+i]=1;
  }
}
carve();
const cellToWorld = (i)=> i*CELL - HALF + CELL/2;
function isOpenAtWorld(x,z){
  return at(Math.floor((x+HALF)/CELL), Math.floor((z+HALF)/CELL));
}

/* ====================== procedural textures ======================
   Canvas-generated so the page stays self-contained. The canvases are
   kept, not discarded, because the normal and roughness maps are derived
   from them: without those, light has nothing to react to and no amount
   of relighting reads as real. */
function makeCanvas(draw, size=256){
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  return c;
}
function texFrom(canvas, repeat=1, srgb=true){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
/* Sobel the luminance into a tangent-space normal map. Surface relief is
   what turns a flat plane into something light can rake across. */
function deriveNormal(src, strength=2.2){
  const s = src.width;
  const sd = src.getContext('2d').getImageData(0,0,s,s).data;
  const lum = new Float32Array(s*s);
  for (let i=0;i<s*s;i++) lum[i] = (sd[i*4]*0.299 + sd[i*4+1]*0.587 + sd[i*4+2]*0.114)/255;
  const out = document.createElement('canvas'); out.width = out.height = s;
  const ctx = out.getContext('2d'), img = ctx.createImageData(s,s), d = img.data;
  const at = (x,y)=> lum[((y+s)%s)*s + ((x+s)%s)];
  for (let y=0;y<s;y++) for (let x=0;x<s;x++){
    const dx = (at(x-1,y-1)+2*at(x-1,y)+at(x-1,y+1)) - (at(x+1,y-1)+2*at(x+1,y)+at(x+1,y+1));
    const dy = (at(x-1,y-1)+2*at(x,y-1)+at(x+1,y-1)) - (at(x-1,y+1)+2*at(x,y+1)+at(x+1,y+1));
    let nx = dx*strength, ny = dy*strength, nz = 1;
    const len = Math.hypot(nx,ny,nz);
    const i = (y*s+x)*4;
    d[i]   = ((nx/len)*0.5+0.5)*255;
    d[i+1] = ((ny/len)*0.5+0.5)*255;
    d[i+2] = ((nz/len)*0.5+0.5)*255;
    d[i+3] = 255;
  }
  ctx.putImageData(img,0,0);
  return out;
}
/* Bright pixels read as worn/polished, dark as matte grime — inverted
   luminance is a serviceable roughness map for surfaces like these. */
function deriveRoughness(src, lo=0.55, hi=1.0){
  const s = src.width;
  const sd = src.getContext('2d').getImageData(0,0,s,s).data;
  const out = document.createElement('canvas'); out.width = out.height = s;
  const ctx = out.getContext('2d'), img = ctx.createImageData(s,s), d = img.data;
  for (let i=0;i<s*s;i++){
    const l = (sd[i*4]*0.299 + sd[i*4+1]*0.587 + sd[i*4+2]*0.114)/255;
    const r = (hi - (hi-lo)*l) * 255;
    d[i*4] = d[i*4+1] = d[i*4+2] = r; d[i*4+3] = 255;
  }
  ctx.putImageData(img,0,0);
  return out;
}
const noiseInto = (ctx,size,amount,alpha)=>{
  const img = ctx.getImageData(0,0,size,size), d = img.data;
  for (let i=0;i<d.length;i+=4){
    const n = (Math.random()-0.5)*amount;
    d[i]+=n; d[i+1]+=n; d[i+2]+=n*0.8; d[i+3]=Math.min(255,d[i+3]*alpha);
  }
  ctx.putImageData(img,0,0);
};
// Damp yellow wallpaper: vertical striping, soft stains, seam relief
const wallCanvas = makeCanvas((ctx,s)=>{
  ctx.fillStyle = '#8e8744'; ctx.fillRect(0,0,s,s);
  for (let x=0;x<s;x+=8){
    ctx.fillStyle = (x/8)%2 ? 'rgba(158,149,88,.22)' : 'rgba(139,130,70,.18)';
    ctx.fillRect(x,0,4,s);
  }
  for (let i=0;i<22;i++){
    const cx = Math.random()*s, cy = Math.random()*s, r = 14+Math.random()*34;
    const g = ctx.createRadialGradient(cx,cy,r*0.15, cx,cy,r);
    g.addColorStop(0,'rgba(108,100,52,.20)');
    g.addColorStop(0.7,'rgba(108,100,52,.12)');
    g.addColorStop(1,'rgba(108,100,52,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  }
  // wallpaper seams every 64px give the normal map something structural
  ctx.strokeStyle = 'rgba(133,124,65,.55)'; ctx.lineWidth = 1;
  for (let x=0;x<s;x+=64){ ctx.beginPath(); ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,s); ctx.stroke(); }
  // skirting trim near the floor edge of the tile
  ctx.fillStyle = 'rgba(120,110,58,.75)'; ctx.fillRect(0, s-14, s, 10);
  noiseInto(ctx,s,26,1);
});
// Flat matted office carpet — dense fibre noise so it reads as pile
const carpetCanvas = makeCanvas((ctx,s)=>{
  ctx.fillStyle = '#74602c'; ctx.fillRect(0,0,s,s);
  for (let i=0;i<9000;i++){
    ctx.fillStyle = `rgba(${104+Math.random()*44|0},${84+Math.random()*36|0},${38+Math.random()*24|0},.55)`;
    ctx.fillRect(Math.random()*s, Math.random()*s, 2, 1);
  }
  // damp patches
  for (let i=0;i<10;i++){
    const cx=Math.random()*s, cy=Math.random()*s, r=18+Math.random()*40;
    const g=ctx.createRadialGradient(cx,cy,r*0.1,cx,cy,r);
    g.addColorStop(0,'rgba(64,52,22,.34)'); g.addColorStop(1,'rgba(64,52,22,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  }
  noiseInto(ctx,s,18,1);
});
// Suspended ceiling tiles with grid runners
const ceilCanvas = makeCanvas((ctx,s)=>{
  ctx.fillStyle = '#d4cfa5'; ctx.fillRect(0,0,s,s);
  for (let i=0;i<2600;i++){
    ctx.fillStyle = `rgba(150,143,105,${Math.random()*0.5})`;
    ctx.fillRect(Math.random()*s, Math.random()*s, 2, 2);
  }
  ctx.strokeStyle = '#9d9570'; ctx.lineWidth = 4;
  ctx.strokeRect(0,0,s,s); ctx.beginPath();
  ctx.moveTo(s/2,0); ctx.lineTo(s/2,s); ctx.moveTo(0,s/2); ctx.lineTo(s,s/2); ctx.stroke();
});
// Soft radial alpha, used for fixture glow and ceiling light spill
const glowCanvas = makeCanvas((ctx,s)=>{
  const g = ctx.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
  g.addColorStop(0,   'rgba(255,246,214,0.95)');
  g.addColorStop(0.35,'rgba(255,240,190,0.34)');
  g.addColorStop(1,   'rgba(255,235,170,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,s,s);
}, 128);

/* ========================== renderer ========================== */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x342d15);
// Tight fog is what makes the maze feel endless — and it culls distant geometry.
scene.fog = new THREE.FogExp2(0x3b3318, 0.019);   // yellow-brown haze, never black
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.05, 200);

/* =========================== geometry ===========================
   Floor and ceiling are single planes with tiled textures. Walls are
   merged into one InstancedMesh, so the entire level is a handful of
   draw calls no matter how many wall segments the maze has. */
const FLOOR = GRID*CELL;

const floorMat = new THREE.MeshStandardMaterial({
  map: texFrom(carpetCanvas, GRID*1.4),
  normalMap: texFrom(deriveNormal(carpetCanvas, 1.1), GRID*1.4, false),
  roughnessMap: texFrom(deriveRoughness(carpetCanvas, 0.95, 1.0), GRID*1.4, false),
  roughness: 1, metalness: 0,
});
floorMat.normalScale.set(0.30, 0.30);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(FLOOR,FLOOR), floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

const ceilMat = new THREE.MeshStandardMaterial({
  map: texFrom(ceilCanvas, GRID),
  normalMap: texFrom(deriveNormal(ceilCanvas, 2.6), GRID, false),
  roughnessMap: texFrom(deriveRoughness(ceilCanvas, 0.86, 1.0), GRID, false),
  roughness: 1, metalness: 0,
});
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(FLOOR,FLOOR), ceilMat);
ceil.rotation.x = Math.PI/2; ceil.position.y = WALL_H;
scene.add(ceil);

/* Painted drywall is not fully matte — a touch of specular response is
   what lets the fixtures rake across it instead of flatly filling it. */
const wallMat = new THREE.MeshStandardMaterial({
  map: texFrom(wallCanvas, 1),
  normalMap: texFrom(deriveNormal(wallCanvas, 1.3), 1, false),
  roughnessMap: texFrom(deriveRoughness(wallCanvas, 0.90, 1.0), 1, false),
  roughness: 1, metalness: 0, vertexColors: true,
});
wallMat.map.repeat.set(1, WALL_H/CELL);
wallMat.normalMap.repeat.set(1, WALL_H/CELL);
wallMat.roughnessMap.repeat.set(1, WALL_H/CELL);
/* Damp wallpaper is matte. Any real sheen reads as wet plastic, which is
   what made the walls look oily — keep relief faint and roughness high. */
wallMat.normalScale.set(0.16, 0.16);

/* Baked AO in vertex colours: dark where wall meets floor and again at
   the ceiling join. Corner darkening is most of what AO buys you
   perceptually, and as vertex data it costs nothing to render. */
const wallGeo = new THREE.PlaneGeometry(CELL, WALL_H, 1, 6);
{
  const posA = wallGeo.attributes.position;
  const col = new Float32Array(posA.count*3);
  for (let i=0;i<posA.count;i++){
    const yN = (posA.getY(i) + WALL_H/2) / WALL_H;        // 0 floor .. 1 ceiling
    const floorAO = THREE.MathUtils.smoothstep(yN, 0.0, 0.30);        // dark at skirting
    const ceilAO  = 1 - 0.35*THREE.MathUtils.smoothstep(yN, 0.82, 1); // slight ceiling join
    const v = (0.72 + 0.28*floorAO) * ceilAO;
    col[i*3] = col[i*3+1] = col[i*3+2] = v;
  }
  wallGeo.setAttribute('color', new THREE.BufferAttribute(col,3));
}

/* One wall face wherever an open cell meets a closed one — the whole
   level is a single InstancedMesh regardless of maze size. */
const faces = [];
for (let y=0;y<GRID;y++) for (let x=0;x<GRID;x++){
  if (!at(x,y)) continue;
  const wx = cellToWorld(x), wz = cellToWorld(y);
  if (!at(x+1,y)) faces.push([wx+CELL/2, wz, -Math.PI/2]);
  if (!at(x-1,y)) faces.push([wx-CELL/2, wz,  Math.PI/2]);
  if (!at(x,y+1)) faces.push([wx, wz+CELL/2, Math.PI]);
  if (!at(x,y-1)) faces.push([wx, wz-CELL/2, 0]);
}
{
  const inst = new THREE.InstancedMesh(wallGeo, wallMat, faces.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  faces.forEach(([x,z,ry],i)=>{
    e.set(0,ry,0); q.setFromEuler(e);
    m.compose(new THREE.Vector3(x, WALL_H/2, z), q, new THREE.Vector3(1,1,1));
    inst.setMatrixAt(i,m);
  });
  inst.instanceMatrix.needsUpdate = true;
  scene.add(inst);
}

/* ============================ lighting ==========================
   The old rig failed because a 0.62 ambient lifted every surface
   uniformly, so nothing was ever dark. Realism here is *contrast*, not
   brightness: crush the ambient, let the fixtures carve pools of light,
   and let the gaps go genuinely gloomy.

   Three colour decisions do most of the remaining work:
     - fixtures are cool and faintly green, like real fluorescent tubes;
     - the walls supply the yellow, so light and pigment aren't the same
       hue and the frame stops reading as a colour filter;
     - the fill is *blue*, because real shadows shift cool rather than
       just darkening. That hue shift is a strong perceptual cue. */
/* The reference is emphatic: the fixtures emit a *yellow* glow, and the
   whole palette sits in one narrow band of muted yellow-green. A cool
   light on warm walls is normal interior practice but wrong here — it
   read as an office at night instead of Level 0. */
const FLUORO = 0xffe6a2;

const lampGeo = new THREE.PlaneGeometry(CELL*0.55, CELL*0.55);
const lampMat = new THREE.MeshBasicMaterial({ color:0xfff2c0, fog:true, toneMapped:false });
const lampCells = [];
for (let y=1;y<GRID-1;y+=2) for (let x=1;x<GRID-1;x+=2){
  if (at(x,y) && rand()<0.55) lampCells.push([cellToWorld(x), cellToWorld(y)]);
}
let lampInst = null;
{
  lampInst = new THREE.InstancedMesh(lampGeo, lampMat, lampCells.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  q.setFromEuler(new THREE.Euler(Math.PI/2,0,0));
  const white = new THREE.Color(1,1,1);
  lampCells.forEach(([x,z],i)=>{
    m.compose(new THREE.Vector3(x, WALL_H-0.06, z), q, new THREE.Vector3(1,1,1));
    lampInst.setMatrixAt(i,m);
    lampInst.setColorAt(i, white);      // per-instance, so one can flicker alone
  });
  lampInst.instanceMatrix.needsUpdate = true;
  scene.add(lampInst);
}

/* Additive glow around each fixture plus spill on the ceiling: the look
   of bloom without paying for a post-processing pass. */
const glowTex = texFrom(glowCanvas, 1);
const glowMat = new THREE.MeshBasicMaterial({ map:glowTex, transparent:true,
  blending:THREE.AdditiveBlending, depthWrite:false, fog:true, toneMapped:false, opacity:0.55 });
{
  const g = new THREE.PlaneGeometry(CELL*2.1, CELL*2.1);
  const inst = new THREE.InstancedMesh(g, glowMat, lampCells.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  q.setFromEuler(new THREE.Euler(Math.PI/2,0,0));
  lampCells.forEach(([x,z],i)=>{
    m.compose(new THREE.Vector3(x, WALL_H-0.10, z), q, new THREE.Vector3(1,1,1));
    inst.setMatrixAt(i,m);
  });
  inst.instanceMatrix.needsUpdate = true;
  scene.add(inst);
}

/* Bright and flat, not dark and moody: the dread comes from even
   coverage with nowhere to hide, so the ambient stays generous. */
scene.add(new THREE.AmbientLight(0xc4b678, 0.74));
scene.add(new THREE.HemisphereLight(0xe0d69e, 0x6b5d29, 0.55));

/* Only the nearest fixtures are real lights; the emissive panels carry
   the look everywhere else. Tighter range than before so the pools read. */
const POOL = 7;
const lampPool = [];
for (let i=0;i<POOL;i++){
  const l = new THREE.PointLight(FLUORO, 0, 19, 2);
  scene.add(l); lampPool.push(l);
}

/* Dust hanging in the light. Cheaper than volumetrics and it does the
   same job of making the air feel like it has something in it. */
let dust = null;
{
  const N = 700, p = new Float32Array(N*3);
  for (let i=0;i<N;i++){
    p[i*3]   = (Math.random()-0.5)*46;
    p[i*3+1] = Math.random()*WALL_H;
    p[i*3+2] = (Math.random()-0.5)*46;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  dust = new THREE.Points(g, new THREE.PointsMaterial({
    color:0xffeec2, size:0.03, transparent:true, opacity:0.28,
    blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true, fog:true }));
  scene.add(dust);
}

/* ============================ player ============================ */
const EYE = 1.62, RADIUS = 0.42;
let WALK = 3.0, RUN = 7.0;
const ACCEL = 30, DECEL = 24, AIR = 8;
const GRAVITY = 22, JUMP_V = 7.0, COYOTE = 0.12, JUMP_BUF = 0.15;

let spawn = null;
for (let y=GRID>>1;y<GRID-1 && !spawn;y++) if (at(GRID>>1,y)) spawn=[cellToWorld(GRID>>1), cellToWorld(y)];
const pos = new THREE.Vector3(spawn[0], 0, spawn[1]);
const vel = new THREE.Vector3();
let vy=0, grounded=true, coyoteT=0, jumpBufT=0, windupT=0, landT=0;
let yaw=0, pitch=0;

/* Slide along walls instead of sticking: resolve each axis separately
   against the grid, which is all a boxy maze needs. */
function moveWithCollision(dx,dz){
  const nx = pos.x + dx;
  if (isOpenAtWorld(nx + Math.sign(dx)*RADIUS, pos.z)) pos.x = nx;
  const nz = pos.z + dz;
  if (isOpenAtWorld(pos.x, nz + Math.sign(dz)*RADIUS)) pos.z = nz;
}

const keys={};
addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code==='Space')e.preventDefault(); });
addEventListener('keyup',e=>keys[e.code]=false);
let dragging=false, px=0, py=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{ if(!dragging)return;
  yaw -= (e.clientX-px)*0.0032;
  pitch = THREE.MathUtils.clamp(pitch - (e.clientY-py)*0.0032, -1.2, 1.2);
  px=e.clientX; py=e.clientY; });

/* =========================== character =========================== */
let avatar, mixer, actions={}, currentAction, footBones=[], clipSpeed={};
const CLIP_TRAVEL = { Walk:85.28, Run:149.23, Moonwalk:49.83 };
const JUMP_WINDUP = 0.33, LAND_HOLD = 0.40;   // matches the Jump clip's crouch
const SOLE_GAP = 0.03, _v = new THREE.Vector3();
const loader = new GLTFLoader();

function play(name, fade=0.18){
  if (!mixer || !actions[name] || currentAction===name) return;
  if (currentAction) actions[currentAction].fadeOut(fade);
  actions[name].paused=false;
  actions[name].reset().fadeIn(fade).play();
  currentAction = name;
}
function posedExtents(root){
  const box = new THREE.Box3(), v = new THREE.Vector3();
  root.traverse(o=>{
    if (!o.isMesh) return;
    const attr = o.geometry.attributes.position;
    for (let i=0;i<attr.count;i++){
      v.fromBufferAttribute(attr,i);
      if (o.isSkinnedMesh && o.skeleton) o.applyBoneTransform(i,v);
      box.expandByPoint(o.localToWorld(v));
    }
  });
  return box;
}
async function loadAvatar(){
  const gltf = await new Promise((res,rej)=>
    loader.load('output/minimal-scifi-sikh-animated.glb?v=4', res, undefined, rej));
  gltf.scene.traverse(o=>{ if(o.isMesh) o.frustumCulled=false; });
  avatar = new THREE.Group(); avatar.add(gltf.scene); scene.add(avatar);
  mixer = new THREE.AnimationMixer(avatar);
  for (const c of gltf.animations) actions[c.name] = mixer.clipAction(c);
  for (const once of ['Jump','Land'])
    if (actions[once]){ actions[once].setLoop(THREE.LoopOnce); actions[once].clampWhenFinished = true; }
  play(actions.Idle ? 'Idle' : 'Walk');
  if (currentAction) actions[currentAction].setEffectiveWeight(1);
  mixer.update(0);
  gltf.scene.traverse(o=>{ if(o.isBone && /Toe|Foot/i.test(o.name)) footBones.push(o); });

  avatar.updateMatrixWorld(true);
  const box = posedExtents(gltf.scene);
  const size = box.getSize(new THREE.Vector3());
  const s = 1.75/size.y;
  gltf.scene.scale.setScalar(s);
  gltf.scene.position.set(-(box.min.x+size.x/2)*s, -box.min.y*s, -(box.min.z+size.z/2)*s);
  /* Hips translation is in rig units (~100x the mesh units), so the
     conversion needs the Hips' accumulated world scale, not the mesh
     scale — using the latter made the run animation crawl. */
  avatar.updateMatrixWorld(true);
  let hipsScale = s * 0.01;
  const hips = avatar.getObjectByName('mixamorig:Hips');
  if (hips && hips.parent){ const sv=new THREE.Vector3(); hips.parent.getWorldScale(sv);
                            if (sv.x>0) hipsScale = sv.x; }
  for (const n of Object.keys(actions)){
    const dur = actions[n].getClip().duration;
    if (CLIP_TRAVEL[n] && dur>0) clipSpeed[n] = CLIP_TRAVEL[n]*hipsScale / dur;
  }
  if (clipSpeed.Walk) WALK = +clipSpeed.Walk.toFixed(2);
  if (clipSpeed.Run)  RUN  = +clipSpeed.Run.toFixed(2);
  document.getElementById('status').textContent =
    `level 0 · ${faces.length} wall faces · ${lampCells.length} fixtures`;
}

/* ============================= loop ============================= */
const clock = new THREE.Clock();
let fpsT=0, frames=0, flicker=0;
const _lampCol = new THREE.Color();
window.__backrooms = { keys, pos, step:()=>tick() };

function tick(){
  const dt = Math.min(clock.getDelta(), 0.05);

  const fwd = new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right = new THREE.Vector3(-fwd.z,0,fwd.x);
  const wish = new THREE.Vector3();
  if (keys['KeyW']) wish.add(fwd);
  if (keys['KeyS']) wish.sub(fwd);
  if (keys['KeyD']) wish.add(right);
  if (keys['KeyA']) wish.sub(right);
  const hasInput = wish.lengthSq()>0;
  if (hasInput) wish.normalize();

  const running = (keys['ShiftLeft']||keys['ShiftRight']) && hasInput;
  const target = wish.multiplyScalar(hasInput ? (running?RUN:WALK) : 0);
  const rate = (grounded ? (hasInput?ACCEL:DECEL) : AIR) * dt;
  vel.x += THREE.MathUtils.clamp(target.x-vel.x, -rate, rate);
  vel.z += THREE.MathUtils.clamp(target.z-vel.z, -rate, rate);
  moveWithCollision(vel.x*dt, vel.z*dt);

  if (keys['Space']) jumpBufT = JUMP_BUF; else jumpBufT = Math.max(0, jumpBufT-dt);
  coyoteT = grounded ? COYOTE : Math.max(0, coyoteT-dt);
  if (jumpBufT>0 && coyoteT>0 && windupT<=0 && grounded){
    windupT = JUMP_WINDUP; coyoteT=0; jumpBufT=0; play('Jump',0.05);
  }
  if (windupT>0){ windupT -= dt; if (windupT<=0){ vy=JUMP_V; grounded=false; } }
  if (!grounded){ vy -= GRAVITY*dt; pos.y += vy*dt;
    if (pos.y<=0){ pos.y=0; vy=0; grounded=true; landT=LAND_HOLD;
                   currentAction=null; if(actions.Land) play('Land',0.06); } }
  if (landT>0) landT -= dt;

  /* Light pool follows the player; only these are real lights. The
     buzzing fixture now dims its *panel* too — previously the light
     flickered while the panel stayed lit, which read as fake. */
  const near = lampCells
    .map(([x,z],idx)=>({x,z,idx,d:(x-pos.x)**2 + (z-pos.z)**2}))
    .sort((a,b)=>a.d-b.d).slice(0,POOL);
  flicker += dt;
  lampPool.forEach((l,i)=>{
    if (i<near.length){
      l.position.set(near[i].x, WALL_H-0.35, near[i].z);
      const buzz = (i===2)
        ? (0.42 + 0.58*Math.abs(Math.sin(flicker*17.3)*Math.sin(flicker*3.1)))
        : 1;
      l.intensity = 13*buzz;
      if (lampInst){
        _lampCol.setScalar(0.25 + 0.75*buzz);
        lampInst.setColorAt(near[i].idx, _lampCol);
        if (lampInst.instanceColor) lampInst.instanceColor.needsUpdate = true;
      }
    } else l.intensity = 0;
  });
  // drift the dust and keep it centred on the player so 700 points cover the level
  if (dust){
    dust.position.set(Math.round(pos.x/46)*46, Math.sin(flicker*0.15)*0.15, Math.round(pos.z/46)*46);
    dust.rotation.y = flicker*0.012;
  }

  if (avatar){
    const speed = Math.hypot(vel.x,vel.z);
    if (speed>0.25) avatar.rotation.y = Math.atan2(vel.x,vel.z);
    if (mixer){
      // State comes from input: holding a key always walks (or runs with
      // Shift), even when a wall has dropped the measured speed to zero.
      if (windupT>0 || !grounded) play('Jump',0.05);
      else if (landT>0 && actions.Land) play('Land',0.06);
      else if (hasInput){
        const name = (running && actions.Run) ? 'Run' : 'Walk';
        play(name);
        const nom = clipSpeed[name];
        if (nom) actions[name].timeScale =
          THREE.MathUtils.clamp(Math.max(speed, (running?RUN:WALK)*0.35)/nom, 0.45, 2.6);
      }
      else if (actions.Idle) play('Idle');
      else if (actions.Walk){ if (currentAction!=='Walk') play('Walk');
                              actions.Walk.paused=true; actions.Walk.time=0; }
    }
    avatar.position.set(pos.x, pos.y, pos.z);
    mixer.update(dt);
    if (footBones.length && grounded){
      avatar.updateMatrixWorld(true);
      let lowest = Infinity;
      for (const b of footBones){ b.getWorldPosition(_v); if(_v.y<lowest) lowest=_v.y; }
      if (isFinite(lowest)) avatar.children[0].position.y -= ((lowest-SOLE_GAP)-pos.y) * Math.min(1,9*dt);
    }
  }

  // third-person camera, pulled in so corridors stay claustrophobic
  const dist = 3.4;
  const cx = pos.x + Math.sin(yaw)*Math.cos(pitch)*dist;
  const cz = pos.z + Math.cos(yaw)*Math.cos(pitch)*dist;
  const cy = pos.y + EYE + Math.sin(pitch)*dist;
  camera.position.lerp(new THREE.Vector3(cx,cy,cz), Math.min(1,14*dt));
  camera.lookAt(pos.x, pos.y+1.2, pos.z);

  renderer.render(scene,camera);
  frames++; fpsT+=dt;
  if (fpsT>=1){ document.getElementById('perf').textContent =
    `${Math.round(frames/fpsT)} fps · ${renderer.info.render.calls} draw calls`; frames=0; fpsT=0; }
}
function safeTick(){
  try { tick(); }
  catch(err){ renderer.setAnimationLoop(null);
              document.getElementById('status').textContent='loop error: '+err.message;
              console.error(err); }
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
loadAvatar()
  .catch(err=>{ document.getElementById('status').textContent='avatar failed: '+err.message; })
  .finally(()=>renderer.setAnimationLoop(safeTick));
</script>
</body>
</html>
